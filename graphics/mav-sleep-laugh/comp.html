<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* "Maverick laughing in his sleep" (2026-11-04): a personal-account meme over a Nanit crib-cam clip.
     Text-only overlay rendered with --alpha and laid over videos/mav-sleep-laugh/base.mp4 (the cut footage, crib window at y=700).
     Type is his reel-cover look: Nunito ExtraBold, white, black stroke; the "THEORY n" eyebrow is a night-vision
     yellow. Safe zone: nothing readable above y=250 or below y=1450, nothing right of x=940. */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../assets/fonts/Inter-700-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; }
  .top { position: absolute; left: 50px; right: 140px; top: 262px; }
  .eyebrow { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .12em; color: #FFD60A;
    text-transform: uppercase; margin-bottom: 14px; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }
  .h { font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 96px; line-height: 1.06; color: #fff;
    -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .h.small { font-size: 92px; }
  .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
  .w.y { color: #FFD60A; }
  .sting { position: absolute; left: 40px; right: 150px; top: 1362px; text-align: center; font-family: "Nunito", system-ui, sans-serif;
    font-weight: 800; font-size: 72px; line-height: 1.1; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; }
  .blk { display: none; } .blk.on { display: block; }
  /* Thought bubble over his head (Kyle, 2026-11-04: "he's dreaming… add an animation"). Cloud at the window's top-left,
     three bubbles trailing down-right toward his head. Each theory swaps the drawing inside. */
  #bub { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #bub .sk { display: none; } #bub .sk.on { display: block; }
  #bub text { font-family: "Nunito", system-ui, sans-serif; font-weight: 800; }
</style></head>
<body>
<div class="stage">
  <svg id="bub" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <g id="dots">
      <circle id="d1" cx="560" cy="1040" r="16" fill="#fff" stroke="#000" stroke-width="7"/>
      <circle id="d2" cx="520" cy="1005" r="24" fill="#fff" stroke="#000" stroke-width="7"/>
      <circle id="d3" cx="480" cy="975" r="34" fill="#fff" stroke="#000" stroke-width="7"/>
    </g>
    <g id="cloud">
      <g stroke="#000" stroke-width="9" fill="#fff">
        <circle cx="180" cy="860" r="110"/><circle cx="300" cy="800" r="120"/><circle cx="440" cy="820" r="115"/>
        <circle cx="520" cy="890" r="90"/><circle cx="240" cy="930" r="85"/><circle cx="380" cy="940" r="95"/>
      </g>
      <g fill="#fff">
        <circle cx="180" cy="860" r="110"/><circle cx="300" cy="800" r="120"/><circle cx="440" cy="820" r="115"/>
        <circle cx="520" cy="890" r="90"/><circle cx="240" cy="930" r="85"/><circle cx="380" cy="940" r="95"/>
      </g>
      <!-- jet (top-down), the Maverick nod: flies through the cloud on the hook -->
      <g id="sk0" class="sk"><g id="jet" fill="#1a1a1a">
        <polygon points="130,10 100,3 40,1 10,6 0,10 10,14 40,19 100,17"/>
        <polygon points="58,10 28,40 72,40 98,10"/><polygon points="58,10 28,-20 72,-20 98,10"/>
        <polygon points="14,10 -2,-10 24,-10 38,10"/><polygon points="14,10 -2,30 24,30 38,10"/>
        <line id="trail1" x1="-10" y1="34" x2="-130" y2="34" stroke="#9aa" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
        <line id="trail2" x1="-10" y1="-14" x2="-130" y2="-14" stroke="#9aa" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
      </g></g>
      <!-- football -->
      <g id="sk1" class="sk"><g id="ball" transform="translate(350 870)">
        <ellipse rx="110" ry="66" fill="#8a4a1e" stroke="#000" stroke-width="7"/>
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <g stroke="#fff" stroke-width="6" stroke-linecap="round"><line x1="-28" y1="-12" x2="-28" y2="12"/><line x1="-9" y1="-12" x2="-9" y2="12"/><line x1="9" y1="-12" x2="9" y2="12"/><line x1="28" y1="-12" x2="28" y2="12"/></g>
        <path d="M-96,-28 Q-70,-50 -40,-56" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M96,28 Q70,50 40,56" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </g></g>
      <!-- zzz -->
      <g id="sk2" class="sk" fill="#1a1a1a">
        <text id="z1" x="250" y="930" font-size="120">Z</text><text id="z2" x="340" y="870" font-size="90">z</text><text id="z3" x="410" y="820" font-size="64">z</text>
      </g>
      <!-- rates chart dropping -->
      <g id="sk3" class="sk">
        <polyline points="200,760 200,960 540,960" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline id="rate" points="215,800 280,790 330,820 380,805 430,850 470,890 520,950" fill="none" stroke="#d62828" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <text id="pct" x="455" y="780" font-size="72" fill="#d62828">%</text>
        <polygon id="arr" points="500,905 560,905 530,960" fill="#2a9d4a"/>
      </g>
      <!-- alarm clock -->
      <g id="sk4" class="sk"><g transform="translate(350 870)">
        <g fill="#1a1a1a"><ellipse cx="-70" cy="-80" rx="34" ry="22" transform="rotate(-35 -70 -80)"/><ellipse cx="70" cy="-80" rx="34" ry="22" transform="rotate(35 70 -80)"/></g>
        <circle r="96" fill="#fff" stroke="#1a1a1a" stroke-width="12"/>
        <g id="hh" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-48"/></g>
        <g id="mh" stroke="#d62828" stroke-width="9" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-74"/></g>
        <circle r="10" fill="#1a1a1a"/>
      </g></g>
      <!-- the question -->
      <g id="sk5" class="sk"><text id="qm" x="350" y="920" font-size="190" text-anchor="middle" fill="#1a1a1a">?</text></g>
    </g>
  </svg>
  <div class="blk" id="b0"><div class="top"><div class="h" id="h0"></div></div><div class="sting" id="s0"></div></div>
  <div class="blk" id="b1"><div class="top"><div class="eyebrow" id="e1"></div><div class="h" id="h1"></div></div></div>
  <div class="blk" id="b2"><div class="top"><div class="eyebrow" id="e2"></div><div class="h" id="h2"></div></div></div>
  <div class="blk" id="b3"><div class="top"><div class="eyebrow" id="e3"></div><div class="h" id="h3"></div></div></div>
  <div class="blk" id="b4"><div class="top"><div class="eyebrow" id="e4"></div><div class="h small" id="h4"></div></div></div>
  <div class="blk" id="b5"><div class="top"><div class="h" id="h5"></div></div><div class="sting" id="s5"></div></div>
</div>
<script>
  // Cuts in base.mp4: 0 / 3.4 / 5.7 / 7.8 / (10.3 within the last clip) / 11.3 freeze; the giggles sit at
  // 0.75, 2.5, 3.75, 6.0, 8.25 and 10.5 s. Each theory lands a beat before its giggle so the laugh reads as a reply.
  const T = { t1: 3.4, t2: 5.7, t3: 7.8, t4: 10.3, q: 12.0, end: 14.0 };
  window.DURATION = T.end;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const back = (p) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
  const $ = (id) => document.getElementById(id);
  const blocks = [0, 1, 2, 3, 4, 5].map((i) => $("b" + i));

  // Words rise in one by one; words between asterisks are yellow.
  function words(el, html, t, gap = 0.08, dur = 0.28) {
    if (!el.dataset.built) {
      let y = false;
      el.innerHTML = html.split("<br>").map((line) => line.split(" ").map((w) => {
        if (w.startsWith("*")) y = true;
        const cls = y ? "w y" : "w", end = w.endsWith("*"); if (end) y = false;
        return `<span class="${cls}">${w.replace(/\*/g, "")}</span>`;
      }).join(" ")).join("<br>");
      el.dataset.built = "1";
    }
    [...el.querySelectorAll(".w")].forEach((w, i) => {
      const p = clamp((t - i * gap) / dur, 0, 1), e = easeOut(p);
      w.style.opacity = p; w.style.transform = `translateY(${(1 - e) * 50}px)`;
    });
  }
  // The eyebrow pops in with overshoot.
  function pop(el, text, t) {
    el.textContent = text;
    const p = clamp(t / 0.3, 0, 1);
    el.style.opacity = p; el.style.transform = `scale(${(0.6 + 0.4 * back(p)).toFixed(3)})`; el.style.transformOrigin = "left center";
  }

  // Thought bubble: the three dots pop in one after another, then the cloud pops with overshoot and bobs.
  // `sk` picks the drawing; `t` is time since the bubble should start; `inner(tt)` animates the drawing.
  const bub = $("bub"), cloud = $("cloud"), dots = ["d1", "d2", "d3"].map($), sks = [0, 1, 2, 3, 4, 5].map((i) => $("sk" + i));
  function bubble(sk, t, inner) {
    sks.forEach((g, i) => g.classList.toggle("on", i === sk));
    dots.forEach((d, i) => { const p = clamp((t - i * 0.12) / 0.25, 0, 1); d.setAttribute("transform", `translate(${d.getAttribute("cx")} ${d.getAttribute("cy")}) scale(${back(p).toFixed(3)}) translate(${-d.getAttribute("cx")} ${-d.getAttribute("cy")})`); d.style.opacity = p > 0 ? 1 : 0; });
    const cp = clamp((t - 0.36) / 0.35, 0, 1), bob = Math.sin(t * 2.2) * 6;
    cloud.setAttribute("transform", `translate(350 ${(870 + bob).toFixed(1)}) scale(${(0.5 + 0.5 * back(cp)).toFixed(3)}) translate(-350 -870)`);
    cloud.style.opacity = cp > 0 ? 1 : 0;
    bub.style.opacity = t > 0 ? 1 : 0;
    if (cp > 0 && inner) inner(Math.max(0, t - 0.5));
  }
  const jet = (tt) => { const p = easeOut(clamp(tt / 2.0, 0, 1)), x = 150 + p * 230, y = 880 - p * 40 + Math.sin(tt * 3) * 10; $("jet").setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(-12) scale(1.75)`); };
  const football = (tt) => $("ball").setAttribute("transform", `translate(350 ${(870 - Math.abs(Math.sin(tt * 4)) * 40).toFixed(1)}) rotate(${(tt * 90).toFixed(1)})`);
  const zzz = (tt) => [["z1", 0], ["z2", 0.3], ["z3", 0.6]].forEach(([id, d]) => { const ph = ((tt - d) % 1.6 + 1.6) % 1.6, p = ph / 1.6; const el = $(id); el.style.opacity = tt < d ? 0 : (p < 0.8 ? 1 : 1 - (p - 0.8) / 0.2); el.setAttribute("transform", `translate(0 ${(-p * 30).toFixed(1)})`); });
  const RATE_LEN = 420;
  const rates = (tt) => { const p = clamp(tt / 1.2, 0, 1); const r = $("rate"); r.setAttribute("stroke-dasharray", RATE_LEN); r.setAttribute("stroke-dashoffset", (RATE_LEN * (1 - p)).toFixed(1)); const ap = clamp((tt - 1.1) / 0.3, 0, 1); $("arr").setAttribute("transform", `translate(530 ${(930 + 10 * Math.sin(tt * 6)).toFixed(1)}) scale(${back(ap).toFixed(3)}) translate(-530 -930)`); $("pct").style.opacity = p; };
  const clock = (tt) => { $("hh").setAttribute("transform", `rotate(${(tt * 120).toFixed(1)})`); $("mh").setAttribute("transform", `rotate(${(tt * 1440).toFixed(1)})`); };
  const question = (tt) => $("qm").setAttribute("transform", `translate(350 920) scale(${(1 + 0.08 * Math.sin(tt * 5)).toFixed(3)}) translate(-350 -920)`);

  window.seek = (t) => {
    blocks.forEach((b) => b.classList.remove("on"));
    if (t < T.t1) {
      blocks[0].classList.add("on");
      words($("h0"), "*Maverick* laughs<br>in his sleep.", t - 0.1);
      words($("s0"), "Nobody knows what at.", t - 2.45, 0.07);
      bubble(0, t - 0.9, jet);
    } else if (t < T.t2) {
      blocks[1].classList.add("on"); const tt = t - T.t1;
      pop($("e1"), "Theory 1", tt - 0.05);
      words($("h1"), "The Chiefs on<br>*4th and goal.*", tt - 0.15);
      bubble(1, tt - 0.1, football);
    } else if (t < T.t3) {
      blocks[2].classList.add("on"); const tt = t - T.t2;
      pop($("e2"), "Theory 2", tt - 0.05);
      words($("h2"), "Mom saying<br>*“he’s a great<br>sleeper.”*", tt - 0.15);
      bubble(2, tt - 0.1, zzz);
    } else if (t < T.t4) {
      blocks[3].classList.add("on"); const tt = t - T.t3;
      pop($("e3"), "Theory 3", tt - 0.05);
      words($("h3"), "He knows rates<br>are coming<br>*down tomorrow.*", tt - 0.15);
      bubble(3, tt - 0.1, rates);
    } else if (t < T.q) {
      blocks[4].classList.add("on"); const tt = t - T.t4;
      pop($("e4"), "Theory 4", tt - 0.05);
      words($("h4"), "He already knows<br>what time he’s<br>*waking me up.*", tt - 0.15);
      bubble(4, tt - 0.1, clock);
    } else {
      blocks[5].classList.add("on"); const tt = t - T.q;
      words($("h5"), "What is he<br>laughing at?", tt - 0.05, 0.08);
      words($("s5"), "*Wrong answers only.*", tt - 0.7, 0.07);
      bubble(5, tt - 0.1, question);
    }
  };
  window.seek(0);
</script>
</body></html>
