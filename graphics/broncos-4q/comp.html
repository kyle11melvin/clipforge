<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Broncos 4th quarter</title>
<style>
  /* Personal-account meme, not Coastal Money (Kyle, 2026-11-02). Type is the white Nunito ExtraBold with the
     black stroke from his reel covers; colours are Broncos orange and navy. */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../assets/fonts/Inter-700-latin.woff2") format("woff2"); }
  :root { --orange:#FB4F14; --navy:#002244; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .frame { position: absolute; inset: 0; display: none; overflow: hidden; background: #000; }
  .frame.on { display: block; }
  .ph { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
  .head { position: absolute; left: 50px; right: 160px; text-align: center;
    font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 112px; line-height: 1.1; color: #fff;
    -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,.45); }
  .head .o { color: var(--orange); }
  .w { display: inline-block; will-change: transform, opacity; }
  /* heart monitor */
  .mon { position: absolute; left: 60px; width: 860px; top: 1140px; height: 270px; background: rgba(0,0,0,.6); border-radius: 24px; padding: 20px; }
  .mon svg { top: 20px !important; left: 20px !important; width: 820px !important; height: 230px !important; }
  .mon svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bpm { position: absolute; right: 24px; top: 18px; font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 44px;
    color: #fff; letter-spacing: .04em; text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .bpm b { display: block; font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 108px; line-height: 1;
    color: #ff2d2d; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
  .bp { position: absolute; left: 24px; top: 18px; font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 44px; color: #fff;
    letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .bp b { display: block; font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 108px; line-height: 1; color: #fff;
    -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
  .bug { position: absolute; left: 60px; top: 272px; width: 860px; height: 150px; display: flex; align-items: stretch;
    font-family: "Inter", system-ui, sans-serif; font-weight: 700; color: #fff; border-radius: 16px; overflow: hidden;
    background: #0a0f1a; box-shadow: 0 8px 30px rgba(0,0,0,.55); transform-origin: 50% 0; }
  .bug .team { display: flex; align-items: center; gap: 18px; padding: 0 26px; font-size: 50px; letter-spacing: .02em; }
  .bug .team b { font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 72px; }
  .bug .kc { background: #e31837; } .bug .den { background: var(--orange); }
  .bug .ctr { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
  .bug .clock { font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 74px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .bug .down { font-size: 28px; letter-spacing: .1em; color: #ffd36b; white-space: nowrap; }
  .red { position: absolute; inset: 0; box-shadow: inset 0 0 220px 60px rgba(255,20,20,.9); opacity: 0; pointer-events: none; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
  .black { background: #000; }
  .mid { position: absolute; left: 60px; right: 160px; top: 50%; transform: translateY(-50%); text-align: center; }
  .sting { position: absolute; left: 60px; right: 160px; text-align: center; font-family: "Nunito", system-ui, sans-serif; font-weight: 800;
    font-size: 88px; line-height: 1.1; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; }
</style>
</head>
<body>
<!-- 1. Asher laughing: first quarter -->
<div class="frame" id="f1">
  <img class="ph" src="kyle-asher.jpg" alt="">
  <div class="head" style="top:1080px;font-size:104px" id="h1"></div>
</div>
<!-- 2. Kyle, colour -> aged, the 4th quarter -->
<div class="frame" id="f2">
  <img class="ph" id="kcol" src="kyle.jpg" alt="">
  <img class="ph" id="kold" src="kyle-old.jpg" alt="" style="opacity:0">
  <div class="vig"></div>
  <div class="red" id="red"></div>
  <div class="bug" id="bug">
    <div class="team kc">KC <b>24</b></div>
    <div class="ctr"><div class="clock" id="clock">0:11</div><div class="down" id="down">4TH &amp; GOAL</div></div>
    <div class="team den">DEN <b>28</b></div>
  </div>
  <div class="head" style="top:850px;font-size:100px;left:40px;right:120px" id="h2"></div>
  <div class="mon" id="mon">
    <svg viewBox="0 0 860 230" preserveAspectRatio="none">
      <path id="ecg" d="" fill="none" stroke="#ff2d2d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
        style="filter: drop-shadow(0 0 10px rgba(255,45,45,.9))"/>
    </svg>
    <div class="bp" id="bp"></div>
    <div class="bpm" id="bpm"></div>
  </div>
</div>
<!-- 3. black card: and then... -->
<div class="frame black" id="f3"><div class="mid"><div class="head" style="position:static" id="h3"></div></div></div>
<!-- 4. Asher again: they pull it off -->
<div class="frame" id="f4">
  <img class="ph" src="asher.jpg" alt="">
  <div class="head" style="top:300px" id="h4"></div>
  <div class="sting" style="top:1240px" id="s4"></div>
</div>

<script>
  // Timeline (seconds). Cuts are hard; the aged fade and the monitor ramp over the 4th-quarter frame.
  const T = { f1: 0, f2: 3.0, f3: 10.5, f4: 11.9, end: 16.0 };
  window.DURATION = T.end;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const back = (p) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
  const frames = ["f1", "f2", "f3", "f4"].map((id) => document.getElementById(id));

  // Words rise in one by one (the approved motion), 0.09 s apart, 0.3 s each.
  function words(el, html, t, gap = 0.09, dur = 0.3) {
    if (!el.dataset.built) {
      // Words between asterisks are the orange ones: "in the *4th quarter*".
      let orange = false;
      el.innerHTML = html.split("<br>").map((line) => line.split(" ").map((w) => {
        if (w.startsWith("*")) orange = true;
        const cls = orange ? "w o" : "w", end = w.endsWith("*"); if (end) orange = false;
        return `<span class="${cls}">${w.replace(/\*/g, "")}</span>`;
      }).join(" ")).join("<br>");
      el.dataset.built = "1";
    }
    [...el.querySelectorAll(".w")].forEach((w, i) => {
      const p = clamp((t - i * gap) / dur, 0, 1), e = easeOut(p);
      w.style.opacity = p; w.style.transform = `translateY(${(1 - e) * 60}px)`;
    });
  }
  // ECG trace: a flat line with a QRS spike every beat; the beat rate and the amplitude climb with t.
  function ecg(t, bpm, amp) {
    const W = 860, H = 230, base = 150, speed = 260 + bpm * 1.6;   // px per second
    const period = 60 / bpm;
    let d = "";
    const x0 = (t * speed) % W;
    for (let x = 0; x <= W; x += 4) {
      const tx = t - (x0 - x) / speed - (x > x0 ? W / speed : 0);   // time this pixel was drawn
      const ph = ((tx % period) + period) % period / period;
      let y = base;
      if (ph > 0.10 && ph < 0.14) y = base + 12 * amp;                      // q
      else if (ph >= 0.14 && ph < 0.19) y = base - 150 * amp * ((ph - 0.14) / 0.05);
      else if (ph >= 0.19 && ph < 0.25) y = base - 150 * amp * (1 - (ph - 0.19) / 0.06) + (ph > 0.22 ? 30 * amp : 0);
      else if (ph >= 0.25 && ph < 0.29) y = base + 36 * amp * (1 - (ph - 0.25) / 0.04);
      else if (ph >= 0.42 && ph < 0.56) y = base - 30 * amp * Math.sin(((ph - 0.42) / 0.14) * Math.PI);  // t wave
      const gap = Math.abs(x - x0) < 40 && x > x0;                               // the blank "eraser" gap
      d += gap ? "" : (d === "" || Math.abs(x - x0) < 4 ? ` M${x} ${y.toFixed(1)}` : ` L${x} ${y.toFixed(1)}`);
    }
    return d;
  }

  window.seek = (t) => {
    frames.forEach((f) => f.classList.remove("on"));
    if (t < T.f2) {
      const f = frames[0]; f.classList.add("on"); const tt = t;
      f.querySelector(".ph").style.transform = `scale(${(1 + 0.05 * tt / 3).toFixed(4)})`;
      words(document.getElementById("h1"), "Broncos fans in<br>the *1st quarter*", tt - 0.15);
    } else if (t < T.f3) {
      const f = frames[1]; f.classList.add("on"); const tt = t - T.f2, L = T.f3 - T.f2;
      const p = clamp(tt / L, 0, 1);
      // Colour drains into the aged photo from 1.5 s on; the shake and the red pulse build with the heart rate.
      const age = clamp((tt - 1.6) / 5.2, 0, 1);
      document.getElementById("kold").style.opacity = age.toFixed(3);
      const bpm = Math.round(72 + (178 - 72) * easeOut(p));
      const sys = Math.round(118 + (191 - 118) * easeOut(p)), dia = Math.round(78 + (124 - 78) * easeOut(p));
      const shake = 0.5 + 9 * p * p;
      const sx = Math.sin(tt * 47) * shake, sy = Math.cos(tt * 61) * shake * 0.6;
      const zoom = 1 + 0.07 * p;
      for (const id of ["kcol", "kold"]) document.getElementById(id).style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
      const beatPh = (tt * bpm / 60) % 1;
      document.getElementById("red").style.opacity = (p * 0.55 * Math.max(0, 1 - beatPh * 3)).toFixed(3);
      words(document.getElementById("h2"), "Broncos fans in<br>the *4th quarter*", tt - 0.1);
      // Scoreboard: the real finish of KC at DEN, 2026-11-01 (Broncos 28-24): 4th and goal, Mahomes sacked by Roach with
      // 0:04 left. Pops in at 0.3 s; the clock ticks once a second 0:11 -> 0:04 and freezes on 0:04 ("LAST PLAY").
      const bp2 = clamp((tt - 0.3) / 0.4, 0, 1), bug = document.getElementById("bug");
      bug.style.opacity = bp2; bug.style.transform = `translateY(${((1 - back(bp2)) * -80).toFixed(1)}px)`;
      const secs = Math.max(4, 11 - Math.floor(Math.max(0, tt - 0.7) / ((L - 1.2) / 7)));
      const clock = document.getElementById("clock"); clock.textContent = `0:${String(secs).padStart(2, "0")}`;
      const last = secs === 4 && tt > L - 0.5;
      clock.style.color = secs <= 6 ? (Math.floor(tt * 6) % 2 === 0 || last ? "#ff3b3b" : "#fff") : "#fff";
      document.getElementById("down").textContent = last ? "LAST PLAY" : "4TH & GOAL";
      // Monitor pops in at 0.8 s with overshoot.
      const mp = clamp((tt - 0.8) / 0.4, 0, 1), mon = document.getElementById("mon");
      mon.style.opacity = mp; mon.style.transform = `scale(${(0.6 + 0.4 * back(mp)).toFixed(3)})`;
      document.getElementById("ecg").setAttribute("d", ecg(tt, bpm, 0.5 + 0.5 * p));
      const pulse = 1 + 0.08 * Math.max(0, 1 - beatPh * 4) * p;
      document.getElementById("bpm").innerHTML = `<b style="display:block;transform:scale(${pulse.toFixed(3)})">${bpm}</b>BPM`;
      document.getElementById("bp").innerHTML = `<b>${sys}/${dia}</b>BLOOD PRESSURE`;
    } else if (t < T.f4) {
      const f = frames[2]; f.classList.add("on"); const tt = t - T.f3;
      words(document.getElementById("h3"), "and then<br>somehow…", tt - 0.1, 0.12);
    } else {
      const f = frames[3]; f.classList.add("on"); const tt = t - T.f4;
      f.querySelector(".ph").style.transform = `scale(${(1.08 - 0.06 * clamp(tt / 4.1, 0, 1)).toFixed(4)})`;
      words(document.getElementById("h4"), "they *pull it off.*<br>Every time.", tt - 0.05, 0.08);
      words(document.getElementById("s4"), "How many more of these<br>can my heart take?", tt - 1.4, 0.07);
    }
  };
  window.seek(0);
</script>
</body>
</html>
