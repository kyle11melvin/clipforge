<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Reel cover, Coastal Money two-tone (the look of the "You want a better deal on a house?" cover, 2026-11-05):
     a frame from footage-graded.mp4 under a navy tint, the spoken hook above his head, terracotta turn on the last
     line. Frame: videos/rate-wait/cover-frame.png (candidate 1 of cover-candidates.jpg, 1.45 s). Headline stays
     inside the centre 4:5 (y 240–1680) for the grid crop. #b = Nunito white-with-stroke variant (his reel-cover type). */
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #173F4F; }
  .frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .tint { position: absolute; inset: 0; background: linear-gradient(rgba(23,63,79,.78) 0%, rgba(23,63,79,.55) 34%, rgba(23,63,79,.35) 60%, rgba(23,63,79,.6) 100%); }
  .head { position: absolute; left: 64px; right: 64px; top: 200px; font-family: "Sora", sans-serif; font-weight: 700; font-size: 124px; line-height: 1.04; letter-spacing: -0.02em; color: #EFE9DE; }
  .head .t { color: #D77B52; }
  html.b .tint { background: linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,0) 45%); }
  html.b .head { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 118px; line-height: 1.1; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; letter-spacing: 0; text-align: center; }
  html.b .head .t { color: #fff; }
</style></head>
<body>
<img class="frame" src="../../videos/rate-wait/cover-frame.png">
<div class="tint"></div>
<div class="head">What rate<br>are you<br><span class="t">waiting for?</span></div>
<script>if (location.hash === '#b') document.documentElement.classList.add('b'); window.seek = () => {};</script>
</body></html>
