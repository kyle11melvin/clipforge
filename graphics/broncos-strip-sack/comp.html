<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Broncos strip sack</title>
<style>
  /* Personal-account game meme (2026-11-09): Kyle's screen recording of the final play, then him and Asher shocked.
     Rendered with --alpha: transparent while the clip plays (ffmpeg puts the footage underneath), opaque on the photo. */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  :root { --orange:#FB4F14; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .frame { position: absolute; inset: 0; display: none; overflow: hidden; }
  .frame.on { display: block; }
  .ph { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 62% 40%; }
  .head { position: absolute; left: 40px; right: 40px; text-align: center;
    font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 104px; line-height: 1.08; color: #fff;
    -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,.45); }
  .head .o { color: var(--orange); }
  .w { display: inline-block; will-change: transform, opacity; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .safe { position: absolute; background: rgba(255,0,0,.35); display: none; }
  body.safezones .safe { display: block; }
</style>
</head>
<body>
<div class="frame" id="f1">
  <div class="head" id="h1" style="top:262px"></div>
</div>
<div class="frame" id="f2" style="background:#000">
  <img class="ph" id="ph" src="shock.jpg" alt="">
  <div class="head" id="h2" style="top:270px;left:20px;right:150px;font-size:128px;line-height:1.04"></div>
  <div class="flash" id="flash"></div>
</div>
<div class="safe" style="left:0;top:0;width:1080px;height:250px"></div>
<div class="safe" style="left:0;top:1450px;width:1080px;height:470px"></div>
<div class="safe" style="left:940px;top:0;width:140px;height:1920px"></div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const T = { clip: 0, photo: parseFloat(q.get("cut") || 7.0), end: parseFloat(q.get("end") || 9.0) };
  window.DURATION = T.end;
  if (q.has("safe")) document.body.classList.add("safezones");
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const back = (p) => { const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
  function build(el, html) {
    if (el.dataset.built) return; let orange = false;
    el.innerHTML = html.split("<br>").map((line) => line.split(" ").map((w) => {
      if (w.startsWith("*")) orange = true;
      const cls = orange ? "w o" : "w"; if (w.endsWith("*")) orange = false;
      return `<span class="${cls}">${w.replace(/\*/g, "")}</span>`;
    }).join(" ")).join("<br>");
    el.dataset.built = "1";
  }
  const f1 = document.getElementById("f1"), f2 = document.getElementById("f2");
  const h1 = document.getElementById("h1"), h2 = document.getElementById("h2");
  build(h1, "Up 5. *1:24 left.*<br>Panthers driving…");
  build(h2, "WAIT…<br>*WE WON?!*");
  window.seek = (t) => {
    f1.classList.toggle("on", t < T.photo); f2.classList.toggle("on", t >= T.photo);
    if (t < T.photo) {
      // The hook is readable on frame one (no rise on the first line), the second line rises at 0.5 s.
      [...h1.querySelectorAll(".w")].forEach((w, i) => {
        const start = i < 4 ? -1 : 0.5 + (i - 4) * 0.09, p = clamp((t - start) / 0.3, 0, 1);
        w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 60}px)`;
      });
    } else {
      const u = t - T.photo;
      // Hard cut: the photo slams from 1.22 to 1.0 with a shake, then a slow push toward their faces.
      const slam = 1 + 0.22 * (1 - easeOut(clamp(u / 0.22, 0, 1)));
      const push = 1 + 0.10 * clamp((u - 0.22) / (T.end - T.photo), 0, 1);
      const sh = Math.max(0, 1 - u / 0.45), dx = Math.sin(u * 95) * 16 * sh, dy = Math.cos(u * 78) * 12 * sh;
      document.getElementById("ph").style.transform = `translate(${dx}px,${dy}px) scale(${slam * push})`;
      document.getElementById("flash").style.opacity = 0.7 * Math.max(0, 1 - u / 0.14);
      const ws = [...h2.querySelectorAll(".w")];
      ws.forEach((w, i) => {
        const start = i === 0 ? 0.05 : 0.6 + (i - 1) * 0.16, p = clamp((u - start) / 0.28, 0, 1);
        w.style.opacity = p > 0 ? 1 : 0; w.style.transform = `scale(${p > 0 ? 2.1 - 1.1 * back(p) : 1})`;
      });
    }
  };
  window.seek(0);
</script>
</body>
</html>
