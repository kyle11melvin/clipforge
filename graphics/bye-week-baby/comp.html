<body>
<!-- Personal-account meme (2026-11-16), Kyle's storyline: Broncos games are the stress. Two weeks ago (KC 28-24) ->
     last week (at Carolina 26-21) -> bye week, RedZone, finally relaxing -> "Honey... my water broke" -> the fright,
     the recliner goes over -> next Sunday, Broncos-Raiders on TV, baby girl. Broadcast-style score bug per beat.
     Transitions: whip, dissolves, a smash cut on the fright, a fade through black. No music. -->
<!-- Beats A and B (Kyle, round 13: "have the guy sitting in front of the TV with the Broncos game ... you don't need to
     go to the actual game footage ... make it more smooth"): the same living room, the real clips playing small on the TV
     screen (frames in logan/ and strip/, gitignored), their real calls as the sound. -->
<div class="frame" id="fO"><img class="ph" id="imO" src="watch.jpg" alt="" style="transform-origin:30% 40%"><div class="sub" id="subO" style="font-size:72px;top:960px"></div></div>
<div class="frame" id="fA"><div class="room" id="roomA"><img class="ph" src="side-relax.jpg" alt=""><div class="tv" id="lg"></div></div><img class="ph" id="midA" src="stress-b.jpg" alt="" style="transform-origin:50% 30%"><img class="ph" id="yesA" src="fist.jpg" alt="" style="transform-origin:0 0"><img class="ph" id="brA" src="watch.jpg" alt="" style="transform-origin:30% 40%"><div class="super" id="supA" style="top:1090px">TWO WEEKS AGO</div><div class="sub" id="subA" style="top:1128px"></div><div class="bug2" id="bA" style="top:1290px"></div></div>
<div class="frame" id="fB"><div class="room" id="roomB"><img class="ph" src="side-relax.jpg" alt=""><div class="tv" id="st"></div></div><img class="ph" id="midB" src="side-fall.jpg" alt="" style="transform-origin:0 0"><img class="ph" id="yesB" src="fist.jpg" alt="" style="transform-origin:0 0"><img class="ph" id="brB" src="watch.jpg" alt="" style="transform-origin:30% 40%"><div class="super" id="supB" style="top:1090px">LAST WEEK</div><div class="sub" id="subB" style="top:1128px"></div><div class="bug2" id="bB" style="top:1290px"></div></div>
<div class="frame" id="fC"><img class="ph" id="rel" src="chill.jpg" alt="" style="transform-origin:16% 34%"><div class="super" id="sup1">THIS SUNDAY · BYE WEEK</div><div class="sub" id="sub1"></div>
  <div class="honey" id="honey"><small>FROM THE OTHER ROOM</small><i id="ht"></i></div><div class="bug2 wide" id="bC"></div></div>
<div class="frame" id="fD"><img class="ph" id="shk" src="side-fall.jpg" alt="" style="transform-origin:19% 33%"><div class="sub" id="what" style="font-size:96px">WHAT?!</div><div class="bug2 wide" id="bD"></div></div>
<div class="frame black" id="fE"><div class="next"><span id="nx"></span><small id="nx2">WEEK 11</small></div></div>
<div class="frame" id="fF"><img class="ph" id="imF" src="side-couch.jpg" alt=""><div class="sub" id="sub4"></div><div class="bug2" id="bF"></div></div>

<script>
  const LG = 198, lg = document.getElementById("lg");
  lg.innerHTML = Array.from({ length: LG }, (_, i) => `<img style="visibility:hidden" src="logan/f${String(i + 1).padStart(4, "0")}.jpg" alt="">`).join("");
  const lgImgs = [...lg.children];
  const ST = 132, stEl = document.getElementById("st");
  stEl.innerHTML = Array.from({ length: ST }, (_, i) => `<img style="visibility:hidden" src="strip/f${String(i + 1).padStart(4, "0")}.jpg" alt="">`).join("");
  const stImgs = [...stEl.children];
  const T = { O: 0, A: 1.5, B: 9.4, C: 15.1, wife: 17.1, E: 18.5, F: 19.3, end: 23.6 };   // round 22: a breather after each win   // round 21: Logan from midfield; a pause on the couch   // round 19: his order; the fall is out   // the calm lasts 1.3 s on purpose: that is the joke   // A and B are as long as their announcer calls
  window.DURATION = T.end;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const ease = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const back = (p) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
  const $ = (id) => document.getElementById(id);
  const drift = (t, k = 1) => `translate(${(Math.sin(t * 0.9) * 5 * k).toFixed(2)}px,${(Math.cos(t * 0.7) * 4 * k).toFixed(2)}px)`;   // handheld
  const DEN = "#FB4F14", KC = "#E31837", CAR = "#0085CA", LV = "#8a8f95";
  const team = (ab, col, score, rec = "") => `<div class="tm" style="background:${col}"><span class="ab">${ab}</span><span class="rec">${rec}</span>${score === "" ? "" : `<span class="sc">${score}</span>`}</div>`;
  const bug = (el, inner, tick, p = 1) => { el.innerHTML = `<div class="bar">${inner}</div><div class="tick">${tick}</div>`;
    el.style.opacity = ease(clamp(p, 0, 1)); el.style.transform = ""; };   // fades in place (round 18: "let it flow")
  const count = (to, p) => Math.round(to * clamp(p, 0, 1));

  // The win reaction (Kyle, round 14: "have him lean forward ... like yes ... some kind of reaction"): a stand-in until a
  // real fist-pump frame exists: the upper body of side-fall.jpg (arms up, mouth open), cropped so the chair is out of frame.
  // kick: a small pump on each beat of the call (a list of times), so he is not a frozen pose while the announcer builds
  const kick = (tt, times) => times.reduce((m, t0) => Math.max(m, tt >= t0 ? Math.exp(-(tt - t0) * 6) * Math.sin(Math.min(1, (tt - t0) / 0.09) * Math.PI / 2) : 0), 0);
  function yes(img, tt, at, x0, y0, w, d = 1.0, times = []) {
    const kk = kick(tt, times);
    const p = ease(clamp((tt - at) / d, 0, 1)), k = 1080 / w * (1 + 0.06 * ease(clamp((tt - at) / 2.2, 0, 1)) + 0.035 * kk);
    y0 = y0 + 26 * kk / (1080 / w);   // a slow dissolve and a slow push
    img.style.opacity = p; img.style.transform = `translate(${(-x0 * k).toFixed(1)}px,${(-y0 * k).toFixed(1)}px) scale(${k.toFixed(4)})`;
    return p;
  }
  // Round 20 (Kyle: "the player is going from the 50 to the 45 to 40 ... the guy has the same reaction, that's why it's
  // terrible"): the reaction climbs with the call. Stage 1 the room, stage 2 a close-up with his eyes wide, stage 3 the fist
  // pump; the announcer's own words run as the caption so the build is on screen too.
  function mid(img, tt, at, base) { const p = ease(clamp((tt - at) / 0.35, 0, 1)); img.style.opacity = p;
    img.style.transform = `scale(${(base + 0.18 * ease(clamp((tt - at) / 1.6, 0, 1))).toFixed(4)})`; return p; }
  // After each win he sits back and breathes (Kyle: "he sits back and relax, he can breathe because it's a lot").
  function breathe(img, tt, at) { const p = ease(clamp((tt - at) / 0.8, 0, 1)); img.style.opacity = p;
    img.style.transform = `scale(${(1.10 - 0.08 * ease(clamp((tt - at) / 1.6, 0, 1))).toFixed(4)})`; return p; }
  const said = (lines, tt) => { let cur = ""; for (const [at, text] of lines) if (tt >= at) cur = text; return cur; };
  const scenes = [
    { id: "fO", at: T.O, draw(tt) {
      $("imO").style.transform = `${drift(tt, 0.5)} scale(${(1.0 + 0.05 * ease(clamp(tt / 2.6, 0, 1))).toFixed(4)})`;
      $("subO").innerHTML = "<div>Being a Broncos fan…</div>"; $("subO").style.opacity = ease(clamp((tt - 0.2) / 0.4, 0, 1)) * (1 - clamp((tt - 1.3) / 0.4, 0, 1)); } },
    { id: "fA", at: T.A, tr: "dissolve", dur: 0.9, draw(tt) {
      const n = clamp(Math.floor(tt * 30), 0, LG - 1); lgImgs.forEach((im, i) => { im.style.visibility = i === n ? "visible" : "hidden"; });
      $("roomA").style.transform = `${drift(tt, 0.4)} scale(${(1.02 + 0.30 * ease(clamp(tt / 5.6, 0, 1))).toFixed(4)})`;   // the push speeds up with the call
      $("roomA").style.filter = "brightness(0.9) saturate(0.92)";
      // Logan's call from midfield (1.0 s into Kyle's recording = 0 here): "Here we go" 0.0, "Midfield" 0.5, "Coleman, 45, 40" 1.1,
      // "Here we go" 2.4, "35, 30" 2.9, "25, 20" 3.9, "foot race" 4.9, "15, 10" 5.4. He gets louder on the same beats.
      $("midA").style.opacity = 0; const m = yes($("yesA"), tt, 1.2, 0, 0, 1080, 0.6, [1.5, 1.95, 2.9, 3.3, 3.9, 4.3, 4.9, 5.4, 5.8]), br = breathe($("brA"), tt, 6.5);   // round 24: up on "45, 40", a pump per yard line
      $("supA").style.opacity = clamp((tt - 0.2) / 0.5, 0, 1) * (1 - m);
      const line = said([[0.5, "Come on…"], [1.5, "Go… go…"], [2.9, "GO! GO! GO!"], [4.9, "YES! YES!"], [7.0, "Phew."]], tt);
      $("subA").innerHTML = `<div>${line}</div>`; $("subA").style.fontSize = tt >= 4.9 && tt < 7.0 ? "88px" : tt >= 2.9 && tt < 4.9 ? "74px" : "60px";
