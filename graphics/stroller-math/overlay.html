<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Stroller math (2026-11-28), round four: the 25.7 s cut (tight-cut.py). The number is on screen from the first
     frame, it ends on his question and the smile, type is Sora and Playfair only, the house is a SoCal one. No corner
     circle; an arrow and a percent climb with the growth. Round two notes still hold: one alpha layer over a walking selfie (cap top is
     y>=795 in cut.mp4), everything big is real 3D:
       type      extruded letters (stacked copies in Z) that sway in perspective
       $250      a giant extruded numeral that spins in
       the math  a full-screen paper beat: 18 columns on a stage, drawn with a perspective camera that orbits
       the home  a real photo as a tilted card over its own blurred copy
     Times in T and data-t are Parakeet word starts on the tight cut. #zones paints the Reels chrome.
     No opacity on anything extruded: opacity flattens preserve-3d. No ctx.filter and no SVG turbulence: both made
     the round-two render take 22 minutes. */
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  @font-face { font-family: "Playfair"; src: url("../fonts/PlayfairDisplay-Italic.ttf"); font-style: italic; }
  :root { --navy:#173F4F; --ink:#0E2A35; --sand:#EFE9DE; --terra:#D77B52; --grow:#2E8571; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { position: relative; font-family: "Manrope", sans-serif; }
  #scrim { position: absolute; inset: 0 0 auto 0; height: 1000px; background: linear-gradient(rgba(14,42,53,.62), rgba(14,42,53,0)); opacity: 0; }
  .sm { position: absolute; left: 72px; font-family: "Playfair", serif; font-style: italic; color: var(--sand); white-space: nowrap;
        text-shadow: 0 4px 26px rgba(14,42,53,.65), 0 1px 3px rgba(14,42,53,.5); }
  .sm span { display: inline-block; opacity: 0; white-space: pre; }
  .persp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1300px; perspective-origin: 500px 520px; pointer-events: none; }
  .rot { position: absolute; transform-style: preserve-3d; white-space: nowrap; }
  .xw { display: inline-block; position: relative; transform-style: preserve-3d; font-family: "Sora", sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-right: .22em; transform: scale(0); }
  .xw i { position: absolute; left: 0; top: 0; font-style: normal; }
  .xw b { position: relative; font-weight: 800; display: block; }

  #paper { position: absolute; inset: 0; background-color: #EFE9DE; opacity: 0; overflow: hidden; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(60,40,20,.18)); }
  #chart { position: absolute; left: 0; top: 0; }
  #lab { position: absolute; left: 76px; top: 282px; font-family: "Playfair", serif; font-style: italic; font-size: 60px; color: var(--ink); }
  #foot { position: absolute; left: 76px; top: 1410px; font-size: 24px; font-weight: 600; color: rgba(14,42,53,.6); white-space: nowrap; }
  #plab { position: absolute; left: 82px; top: 846px; font-family: "Playfair", serif; font-style: italic; font-size: 42px; color: var(--ink); opacity: 0; }

  #photo, #photoBack { position: absolute; left: 150px; top: 272px; width: 640px; height: 480px; background: url(house.jpg) center/cover; border-radius: 20px; }
  #photo { border: 14px solid #fff; box-shadow: 0 70px 100px rgba(4,18,26,.6), 0 20px 34px rgba(4,18,26,.4); }
  #photoBack { filter: blur(24px) brightness(.6) saturate(1.1); border-radius: 28px; }
  #tag { position: absolute; left: 262px; top: 666px; background: #F6F1E7; color: var(--ink); font-family: "Playfair", serif; font-style: italic; font-size: 60px; line-height: 1; padding: 20px 34px 24px; border-radius: 10px; white-space: nowrap;
         box-shadow: 0 28px 44px rgba(4,18,26,.55), 0 6px 10px rgba(4,18,26,.3); }
  #under { position: absolute; left: 66px; top: 716px; }
  .zone { position: absolute; background: rgba(255,0,0,.28); display: none; z-index: 99; }
</style></head>
<body>
<div id="scrim"></div>

</div></div>

<svg id="under" width="860" height="40"><path id="up" d="M8 22 C 180 6, 420 34, 560 16 S 800 10, 850 24" fill="none" stroke="#D77B52" stroke-width="12" stroke-linecap="round"/></svg>

<div class="zone" style="left:0;top:0;width:1080px;height:250px"></div>
<div class="zone" style="left:0;top:1450px;width:1080px;height:470px"></div>
<div class="zone" style="left:940px;top:0;width:140px;height:1920px"></div>

<script>
const T = { t1Out: 4.42, in2: 4.75, out2: 9.0, paperIn: 9.1, lineA: 9.15, lineB: 10.3, landA: 11.6, pct: 12.88,
            num: 15.26, loA: 15.7, loB: 17.6, hiA: 18.1, hiB: 19.2, paperOut: 19.44, home: 20.55, homeOut: 23.25, q: 23.44, last: 24.78 };
const $ = (id) => document.getElementById(id);
const cl = (x) => Math.max(0, Math.min(1, x));
const p = (t, a, d) => cl((t - a) / d);
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const io = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const back = (x) => { const c = 2.6; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");

// paper grain, drawn once from a seeded generator (an SVG turbulence filter re-rasterises on every frame)
{ const c = document.createElement("canvas"); c.width = 270; c.height = 480; const g = c.getContext("2d"), im = g.createImageData(270, 480);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd(); im.data[i] = 120; im.data[i + 1] = 100; im.data[i + 2] = 78; im.data[i + 3] = v * v * 46; }
  g.putImageData(im, 0, 0); $("paper").style.backgroundImage = `url(${c.toDataURL()})`; $("paper").style.backgroundSize = "540px 960px"; }

// flat word-by-word lines
document.querySelectorAll(".sm").forEach((row) => {
  const times = row.dataset.w.split(",").map(Number), ws = row.textContent.split(" "); row.textContent = "";
  ws.forEach((w, i) => { const s = document.createElement("span"); s.textContent = w + (i < ws.length - 1 ? " " : ""); s.dataset.t = times[Math.min(i, times.length - 1)]; row.append(s); });
});
function flat(id, t, outAt) { const o = 1 - p(t, outAt, .22);
  $(id).querySelectorAll("span").forEach((s) => { const k = out3(p(t, +s.dataset.t - .03, .24)); s.style.opacity = k * o; s.style.transform = `translateY(${(1 - k) * 30}px)`; }); }

// extruded words: N copies stepped back in Z, the deepest one carrying the cast shadow
document.querySelectorAll(".xw").forEach((w) => {
  const txt = w.textContent, n = +(w.dataset.n || 26); w.textContent = ""; w._layers = [];
  for (let k = n; k >= 1; k--) { const i = document.createElement("i"); i.textContent = txt; i.style.color = w.dataset.d; i.style.transform = `translateZ(${-k * 1.7}px)`;
    if (k === n) i.style.textShadow = "0 30px 44px rgba(4,18,26,.6)"; w.append(i); w._layers.push(i); }
  const b = document.createElement("b"); b.textContent = txt; b.style.color = w.dataset.c; w.append(b); w._layers.push(b);
});
const setText = (w, s) => { if (w._s === s) return; w._s = s; w._layers.forEach((l) => l.textContent = s); };
// each word slams in on its own time (overshoot, a quarter turn), pulses when its number lands (data-p), and the
// whole line sways; `outAt` shrinks it away
function ext(id, t, outAt, sway = 1, spin = 28) {
  const r = $(id), o = 1 - out3(p(t, outAt, .2));
  r.querySelectorAll(".xw").forEach((w) => { const k = p(t, +w.dataset.t - .05, .3), pt = +w.dataset.p;
    const pulse = pt && t >= pt ? 1 + .16 * Math.exp(-(t - pt) * 7) * Math.cos((t - pt) * 16) : 1;
    w.style.transform = `scale(${back(k) * o * pulse}) rotateY(${(1 - out3(k)) * spin}deg) rotateX(${(1 - out3(k)) * -40}deg)`; });
  r.style.transform = `rotateY(${-14 + Math.sin(t * 1.5 + r.offsetTop) * 8 * sway}deg) rotateX(${6 + Math.cos(t * 1.2) * 3.5 * sway}deg) translateY(${(1 - o) * -60}px)`;
}

// ---- the math: 18 columns on a stage, perspective camera ----
const PAY = 250, fv = (r, m) => r === 0 ? PAY * m : PAY * (Math.pow(1 + r / 12, m) - 1) / (r / 12);
const cv = $("chart"), ctx = cv.getContext("2d");
const soft = document.createElement("canvas"); soft.width = 135; soft.height = 240; const sctx = soft.getContext("2d");   // shadows at 1/8 size, scaled up = blurred
const K = 4.6 / 1000, W = 34, PITCH = 45.5, DEPTH = 66, X0 = -PITCH * 8.5;
let cam;
function proj([x, y, z]) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y * cp + z1 * sp, z2 = -y * sp + z1 * cp, s = cam.f / (cam.dist + z2);
  return [cam.cx + x1 * s, cam.cy - y1 * s, z2];
}
function poly(pts, fill, c = ctx, k = 1) { const q = pts.map(proj); let a = 0;
  for (let i = 0; i < q.length; i++) { const [x1, y1] = q[i], [x2, y2] = q[(i + 1) % q.length]; a += x1 * y2 - x2 * y1; }
  if (a > 0) return;                                   // facing away
  c.beginPath(); q.forEach(([x, y], i) => i ? c.lineTo(x * k, y * k) : c.moveTo(x * k, y * k)); c.closePath();
  if (typeof fill === "function") fill = fill(q); c.fillStyle = fill; c.fill(); }
function box(x, y0, y1, c) {
  if (y1 - y0 < .5) return; const a = x - W / 2, b = x + W / 2, n = -DEPTH / 2, f = DEPTH / 2;
  const grad = (q) => { const g = ctx.createLinearGradient(0, Math.min(...q.map((v) => v[1])), 0, Math.max(...q.map((v) => v[1]))); g.addColorStop(0, c.front[0]); g.addColorStop(1, c.front[1]); return g; };
  poly([[a, y0, f], [b, y0, f], [b, y1, f], [a, y1, f]].reverse(), c.side);
  poly([[a, y0, n], [a, y0, f], [a, y1, f], [a, y1, n]].reverse(), c.side);
  poly([[b, y0, n], [b, y1, n], [b, y1, f], [b, y0, f]].reverse(), c.side);
  poly([[a, y0, n], [a, y1, n], [b, y1, n], [b, y0, n]].reverse(), grad);
  poly([[a, y0, n], [a, y1, n], [a + 5, y1, n], [a + 5, y0, n]].reverse(), "rgba(255,255,255,.22)");   // a lit edge
  poly([[a, y1, n], [a, y1, f], [b, y1, f], [b, y1, n]].reverse(), c.top);
}
const NAVY = { front: ["#2F7692", "#173F4F"], side: "#0E2A35", top: "#4C9DBB" };
const GROW = { front: ["#43B299", "#2A7C69"], side: "#1A5547", top: "#6FD3B9" };
const RANGE = { front: ["#C9EEE3", "#93D3C0"], side: "#69AE9A", top: "#EAF9F4" };
function chart(t) {
  ctx.clearRect(0, 0, 1080, 1920);
  const u = io(p(t, T.paperIn, T.paperOut - T.paperIn));
  cam = { yaw: (-38 + 28 * u) * Math.PI / 180, pitch: (24 - 5 * u) * Math.PI / 180, f: 1850, dist: 1800 + 260 * io(p(t, T.loA - .4, T.hiB - T.loA)), cx: 478, cy: 1195 };
  const plate = (y, pad) => [[-470 - pad, y, -150 - pad], [-470 - pad, y, 170 + pad], [470 + pad, y, 170 + pad], [470 + pad, y, -150 - pad]];
  const cols = [];
  for (let i = 0; i < 18; i++) {
    const m = (i + 1) * 12, f = i / 17;
    const a = back(p(t, T.lineA + f * (T.lineB - T.lineA - .3), .42));
    const lo = out3(p(t, T.loA + f * (T.loB - T.loA - .4), .45)), hi = out3(p(t, T.hiA + f * (T.hiB - T.hiA - .4), .45));
    const c = PAY * m * K * a, l = c + (fv(.05, m) - PAY * m) * K * lo, h = l + (fv(.08, m) - fv(.05, m)) * K * hi;
    cols.push({ i, x: X0 + i * PITCH, c, l, h, z: proj([X0 + i * PITCH, 0, 0])[2] });
  }
  // soft shadows: the stage on the paper, the columns on the stage
  sctx.clearRect(0, 0, 135, 240);
  sctx.save(); sctx.translate(0, 7); poly(plate(-26, 26).reverse(), "rgba(60,40,20,.5)", sctx, .125); sctx.restore();
  ctx.imageSmoothingQuality = "high"; ctx.drawImage(soft, 0, 0, 1080, 1920);
  poly(plate(0, 0).reverse(), "#FBF8F2");
  poly([[-470, -26, -150], [-470, 0, -150], [470, 0, -150], [470, -26, -150]].reverse(), "#CFC5B2");
  poly([[470, -26, -150], [470, 0, -150], [470, 0, 170], [470, -26, 170]].reverse(), "#BDB29D");
  poly([[-470, -26, -150], [-470, -26, 170], [-470, 0, 170], [-470, 0, -150]].reverse(), "#BDB29D");
  sctx.clearRect(0, 0, 135, 240);
  cols.forEach((o) => { if (o.h > 1) { const s = 30 + o.h * .2; poly([[o.x - W / 2, .5, -DEPTH / 2], [o.x - W / 2 + s, .5, DEPTH / 2 + s * .9], [o.x + W / 2 + s, .5, DEPTH / 2 + s * .9], [o.x + W / 2, .5, -DEPTH / 2]].reverse(), "rgba(40,30,14,.5)", sctx, .125); } });
  ctx.drawImage(soft, 0, 0, 1080, 1920);
  [...cols].sort((a, b) => b.z - a.z).forEach((o) => { box(o.x, 0, o.c, NAVY); box(o.x, o.c, o.l, GROW); box(o.x, o.l, o.h, RANGE); });
  // age marks on the front lip of the stage
  ctx.font = "800 30px Manrope"; ctx.fillStyle = "rgba(14,42,53,.72)";
  [["today", -1], ["age 9", 8], ["age 18", 17]].forEach(([s, i]) => { const [x, y] = proj([X0 + i * PITCH, 0, -118]); ctx.textAlign = i === 17 ? "right" : "center"; ctx.fillText(s, x + (i === 17 ? 26 : 0), y + 10); });
  // the arrow: rides the tops of the columns, climbing as the growth stacks on
  const g = p(t, T.loA - .2, T.hiB - T.loA + .2);
  if (g > 0) {
    const reach = 2 + out3(g) * 15, pts = [];
    const gl = io(p(t, T.loA, T.loB - T.loA)), gh = io(p(t, T.hiA, T.hiB - T.hiA));   // one smooth curve, not the staggered tops
    const top = (i) => { const m = (i + 1) * 12; return (PAY * m + (fv(.05, m) - PAY * m) * gl + (fv(.08, m) - fv(.05, m)) * gh) * K + 46; };
    for (let i = 0; i <= Math.floor(reach); i++) pts.push(proj([cols[i].x, top(i), -DEPTH / 2]));
    const fi = Math.floor(reach), fr = reach - fi;
    if (fi < 17) { const a = proj([cols[fi].x, top(fi), -DEPTH / 2]), b = proj([cols[fi + 1].x, top(fi + 1), -DEPTH / 2]); pts.push([a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr]); }
    const n = pts.length, [ex, ey] = pts[n - 1], [qx, qy] = pts[Math.max(0, n - 3)], ang = Math.atan2(ey - qy, ex - qx);
    const draw = (dy, col) => { ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 20; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy)); ctx.stroke();
      ctx.save(); ctx.translate(ex, ey + dy); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(58, 0); ctx.lineTo(-14, -40); ctx.lineTo(-14, 40); ctx.closePath(); ctx.fill(); ctx.restore(); };
    draw(26, "rgba(40,30,14,.16)"); draw(9, "#8A4425"); draw(0, "#E0835A");
  }
}

window.seek = (t) => {
  $("scrim").style.opacity = Math.max(1 - p(t, T.t1Out, .3), p(t, T.in2, .3) * (1 - p(t, T.out2, .2)), p(t, T.q, .3)) * .9;
  flat("s1", t, T.t1Out); ext("r1", t, T.t1Out, .6); ext("r1b", t, T.t1Out, .7); ext("r1c", t, T.t1Out, .6);
  flat("s2", t, T.out2); ext("r2", t, T.out2, .8, 90); ext("r2b", t, T.out2);

  // paper beat: a hard cut in and out, on the picture cuts
  const on = t >= T.paperIn && t < T.paperOut;
  $("paper").style.opacity = on ? 1 : 0;
  if (on) chart(t);
  $("lab").textContent = t < T.pct ? "what I put in by the time he’s 18" : t < T.num ? "and I expect" : "so somewhere between";
  setText($("n1"), usd(54000 * io(p(t, T.lineA, T.landA - T.lineA))));
  setText($("n2"), usd(54000 + (87500 - 54000) * io(p(t, T.loA, T.loB - T.loA))));
  setText($("n3"), "and " + usd(87500 + (120000 - 87500) * io(p(t, T.hiA, T.hiB - T.hiA))));
  const pc = 62 * io(p(t, T.loA, T.loB - T.loA)) + 60 * io(p(t, T.hiA, T.hiB - T.hiA));
  setText($("pct"), "▲ " + Math.round(pc) + "%");
  $("plab").style.opacity = on ? p(t, T.loA, .3) : 0;
  const end3 = on ? T.paperOut + 9 : T.paperOut - .01;      // extruded lines vanish with the paper
  ext("r3", t, Math.min(T.pct - .12, end3), .55); ext("r3p", t, Math.min(T.num - .1, end3), .6); ext("r3b", t, end3, .5); ext("r3c", t, end3, .6);

  // the home: photo card swings in over its blurred copy
  const hin = p(t, T.home, .5), hout = out3(p(t, T.homeOut, .22)), k = back(hin), fl = Math.sin(t * 1.6);
  $("r4").style.transform = `translate(${(1 - out3(hin)) * 760}px, ${hout * -500}px)`;
  $("photo").style.transform = `rotateY(${-18 + (1 - k) * -70 + fl * 5}deg) rotateX(${7 + fl * 2}deg) rotateZ(${-3 + (1 - k) * 12}deg) scale(${hin > 0 ? (.6 + .4 * k) * (1 - hout) : 0})`;
  $("photoBack").style.transform = `translate(${-100 + fl * -10}px, -34px) translateZ(-280px) rotateY(${-10 + fl * 2}deg) rotateZ(5deg) scale(${hin > 0 ? 1.05 * (1 - hout) : 0})`;
  const tg = back(p(t, T.home + .3, .3)); $("tag").style.transform = `translateZ(180px) rotate(-6deg) scale(${tg * (1 - hout)})`;

  flat("s5", t, 999); ext("r5", t, 999, .7);
  const up = $("up"), L = up.getTotalLength(), u = out3(p(t, T.last, .4));
  up.style.strokeDasharray = L; up.style.strokeDashoffset = L * (1 - u); $("under").style.opacity = u > 0 ? 1 : 0;
};
if (location.hash.includes("zones")) document.querySelectorAll(".zone").forEach((z) => z.style.display = "block");
window.seek(0);
</script>
