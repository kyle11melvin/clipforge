<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Broncos bye week</title>
<style>
  /* Personal-account meme, same type as broncos-4q: Nunito ExtraBold white with the black stroke, Broncos orange.
     Three AI frames of the same bronco dad: recliner (calm) → delivery room (chaos, monitor, shake) → holding the baby. */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../assets/fonts/Inter-700-latin.woff2") format("woff2"); }
  :root { --orange:#FB4F14; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .frame { position: absolute; inset: 0; display: none; overflow: hidden; background: #000; }
  .frame.on { display: block; }
  .ph { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 45%; }
  .head { position: absolute; left: 50px; right: 150px; text-align: center; font-family: "Nunito", system-ui, sans-serif; font-weight: 800;
    font-size: 108px; line-height: 1.08; color: #fff; -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,.45); }
  .head .o { color: var(--orange); }
  .sting { position: absolute; left: 50px; right: 150px; text-align: center; font-family: "Nunito", system-ui, sans-serif; font-weight: 800;
    font-size: 84px; line-height: 1.1; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; }
  .w { display: inline-block; will-change: transform, opacity; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.5) 100%); }
  .red { position: absolute; inset: 0; box-shadow: inset 0 0 220px 60px rgba(255,20,20,.9); opacity: 0; }
  .mon { position: absolute; left: 60px; width: 860px; top: 1130px; height: 270px; background: rgba(0,0,0,.62); border-radius: 24px; opacity: 0; transform-origin: 50% 50%; }
  .mon svg { position: absolute; left: 20px; top: 20px; width: 820px; height: 230px; }
  .bpm { position: absolute; right: 24px; top: 18px; font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 40px; color: #fff; text-align: right; letter-spacing: .04em; }
  .bpm b { display: block; font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 108px; line-height: 1; color: #ff2d2d; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
  .lbl { position: absolute; left: 24px; top: 18px; font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 40px; color: #fff; letter-spacing: .04em; }
  .lbl b { display: block; font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 108px; line-height: 1; color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
  .stamp { position: absolute; left: 50%; top: 1000px; transform-origin: 50% 50%; font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 150px;
    line-height: 1; color: #fff; -webkit-text-stroke: 9px #000; paint-order: stroke fill; white-space: nowrap; background: var(--orange); padding: 20px 50px 30px;
    border-radius: 24px; border: 8px solid #000; box-shadow: 0 20px 50px rgba(0,0,0,.6); opacity: 0; }
</style>
</head>
<body>
<!-- 1. recliner: the bye week everyone else is having -->
<div class="frame" id="f1">
  <img class="ph" id="p1" src="recliner.jpg" alt="">
  <div class="head" style="top:290px" id="h1"></div>
  <div class="sting" style="top:1200px;font-size:78px" id="s1"></div>
</div>
<!-- 2. delivery room: my bye week -->
<div class="frame" id="f2">
  <img class="ph" id="p2" src="delivery.jpg" alt="">
  <div class="vig"></div>
  <div class="red" id="red"></div>
  <div class="head" style="top:290px" id="h2"></div>
  <div class="stamp" id="stamp">IT'S TIME</div>
  <div class="mon" id="mon">
    <svg viewBox="0 0 860 230" preserveAspectRatio="none"><path id="ecg" d="" fill="none" stroke="#ff2d2d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" style="filter: drop-shadow(0 0 10px rgba(255,45,45,.9))"/></svg>
    <div class="lbl" id="lbl"></div>
    <div class="bpm" id="bpm"></div>
  </div>
</div>
<!-- 3. the baby -->
<div class="frame" id="f3">
  <img class="ph" id="p3" src="baby.jpg" alt="">
  <div class="head" style="top:290px" id="h3"></div>
  <div class="sting" style="top:1270px" id="s3"></div>
</div>

<script>
  const T = { f1: 0, f2: 2.6, f3: 6.6, end: 10.0 };
  window.DURATION = T.end;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const back = (p) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
  const frames = ["f1", "f2", "f3"].map((id) => document.getElementById(id));
  function words(el, html, t, gap = 0.09, dur = 0.3) {
    if (!el.dataset.built) {
      let orange = false;
      el.innerHTML = html.split("<br>").map((line) => line.split(" ").map((w) => {
        if (w.startsWith("*")) orange = true;
        const cls = orange ? "w o" : "w", end = w.endsWith("*"); if (end) orange = false;
        return `<span class="${cls}">${w.replace(/\*/g, "")}</span>`;
      }).join(" ")).join("<br>");
      el.dataset.built = "1";
    }
    [...el.querySelectorAll(".w")].forEach((w, i) => {
      const p = clamp((t - i * gap) / dur, 0, 1), e = easeOut(p);
      w.style.opacity = p; w.style.transform = `translateY(${(1 - e) * 60}px)`;
    });
  }
  function ecg(t, bpm, amp) {
    const W = 860, base = 150, speed = 260 + bpm * 1.6, period = 60 / bpm;
    let d = ""; const x0 = (t * speed) % W;
    for (let x = 0; x <= W; x += 4) {
      const tx = t - (x0 - x) / speed - (x > x0 ? W / speed : 0);
      const ph = ((tx % period) + period) % period / period;
      let y = base;
      if (ph > 0.10 && ph < 0.14) y = base + 12 * amp;
      else if (ph >= 0.14 && ph < 0.19) y = base - 150 * amp * ((ph - 0.14) / 0.05);
      else if (ph >= 0.19 && ph < 0.25) y = base - 150 * amp * (1 - (ph - 0.19) / 0.06) + (ph > 0.22 ? 30 * amp : 0);
      else if (ph >= 0.25 && ph < 0.29) y = base + 36 * amp * (1 - (ph - 0.25) / 0.04);
      else if (ph >= 0.42 && ph < 0.56) y = base - 30 * amp * Math.sin(((ph - 0.42) / 0.14) * Math.PI);
      const gap = Math.abs(x - x0) < 40 && x > x0;
      d += gap ? "" : (d === "" || Math.abs(x - x0) < 4 ? ` M${x} ${y.toFixed(1)}` : ` L${x} ${y.toFixed(1)}`);
    }
    return d;
  }
  window.seek = (t) => {
    frames.forEach((f) => f.classList.remove("on"));
    if (t < T.f2) {
      frames[0].classList.add("on"); const tt = t;
      document.getElementById("p1").style.transform = `scale(${(1 + 0.04 * tt / 2.6).toFixed(4)})`;
      words(document.getElementById("h1"), "Broncos fans on<br>the *bye week*", tt - 0.1);
      words(document.getElementById("s1"), "No stress this weekend.", tt - 0.9, 0.08);
    } else if (t < T.f3) {
      frames[1].classList.add("on"); const tt = t - T.f2, L = T.f3 - T.f2, p = clamp(tt / L, 0, 1);
      const bpm = Math.round(80 + (190 - 80) * easeOut(p));
      const shake = 1 + 9 * p * p, sx = Math.sin(tt * 47) * shake, sy = Math.cos(tt * 61) * shake * 0.6;
      document.getElementById("p2").style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${(1.02 + 0.08 * p).toFixed(4)})`;
      const beatPh = (tt * bpm / 60) % 1;
      document.getElementById("red").style.opacity = (p * 0.6 * Math.max(0, 1 - beatPh * 3)).toFixed(3);
      words(document.getElementById("h2"), "Me on<br>the *bye week*", tt - 0.05, 0.07);
      const sp = clamp((tt - 0.9) / 0.28, 0, 1), st = document.getElementById("stamp");
      st.style.opacity = sp; st.style.transform = `translate(-50%,-50%) rotate(-8deg) scale(${(3 - 2 * easeOut(sp)).toFixed(3)})`;
      const mp = clamp((tt - 1.5) / 0.4, 0, 1), mon = document.getElementById("mon");
      mon.style.opacity = mp; mon.style.transform = `scale(${(0.6 + 0.4 * back(mp)).toFixed(3)})`;
      document.getElementById("ecg").setAttribute("d", ecg(tt, bpm, 0.5 + 0.5 * p));
      const pulse = 1 + 0.08 * Math.max(0, 1 - beatPh * 4) * p;
      document.getElementById("bpm").innerHTML = `<b style="display:block;transform:scale(${pulse.toFixed(3)})">${bpm}</b>BPM`;
      document.getElementById("lbl").innerHTML = `<b>${Math.round(118 + (191 - 118) * easeOut(p))}/${Math.round(78 + (124 - 78) * easeOut(p))}</b>BLOOD PRESSURE`;
    } else {
      frames[2].classList.add("on"); const tt = t - T.f3;
      document.getElementById("p3").style.transform = `scale(${(1.06 - 0.05 * clamp(tt / 3.4, 0, 1)).toFixed(4)})`;
      words(document.getElementById("h3"), "Welcome to<br>*Broncos Country,*", tt - 0.1, 0.08);
      words(document.getElementById("s3"), "baby girl.", tt - 1.0, 0.1);
    }
  };
  window.seek(0);
</script>
</body>
</html>
