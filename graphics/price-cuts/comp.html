<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Price cuts reel</title>
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  :root { --navy:#173F4F; --terra:#D77B52; --sand:#EFE9DE; --sage-lift:#A9C0B9; }

  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .frame { position: absolute; inset: 0; display: none; overflow: hidden; }
  .frame.on { display: block; }
  .frame img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
  /* Instagram Reels covers roughly the top 250 px and the bottom 470 px of a 1920 frame, and the right 140 px.
     The photo frames keep the type inside that window: the photo sits lower (navy band above it, scrim
     blending in) so the three-line hook clears both the chrome and his hair. */
  .me { background: var(--navy); }
  .me img { top: 280px; left: -75px; width: 1230px; height: 1640px; transform-origin: 50% 50%; }
  .scrim { position: absolute; inset: 0; background:
      linear-gradient(180deg, rgba(23,63,79,1) 0px, rgba(23,63,79,1) 290px, rgba(23,63,79,.75) 430px, rgba(23,63,79,0) 660px),
      linear-gradient(0deg, rgba(23,63,79,.97) 0%, rgba(23,63,79,.90) 24%, rgba(23,63,79,.55) 36%, rgba(23,63,79,0) 48%); }

  .h { position: absolute; left: 64px; right: 140px; top: 290px; font-family: "Sora", sans-serif; font-weight: 700;
       font-size: 88px; line-height: 1.05; letter-spacing: -0.02em; color: var(--sand); }
  .h .terra { color: var(--terra); }
  .cont { position: absolute; left: 64px; width: 860px; bottom: 480px; font-family: "Manrope", sans-serif; font-weight: 700;
          font-size: 58px; line-height: 1.25; letter-spacing: -0.01em; color: var(--sand); }
  .cont .arrow { color: var(--terra); }
  .rise { will-change: transform, opacity; }
  .cursor { display: inline-block; width: 8px; height: 0.82em; background: var(--terra); margin-left: 10px; vertical-align: -0.06em; }
</style>
</head>
<body>
<div class="frame me" id="f0">
  <img src="photo.jpg" alt="">
  <div class="scrim"></div>
  <div class="h">You want a<br><span class="terra">better deal</span><br>on a house?</div>
  <div class="cont">Maybe stop looking exclusively at interest rates.</div>
</div>
<div class="frame cut" data-n="1"><img src="cut1.jpg" alt=""></div>
<div class="frame cut" data-n="2"><img src="cut2.jpg" alt=""></div>
<div class="frame cut" data-n="3"><img src="cut3.jpg" alt=""></div>
<div class="frame cut" data-n="4"><img src="cut4.jpg" alt=""></div>
<div class="frame cut" data-n="5"><img src="cut5.jpg" alt=""></div>
<div class="frame cut" data-n="6"><img src="cut6.jpg" alt=""></div>
<div class="frame cut" data-n="7"><img src="cut7.jpg" alt=""></div>
<div class="frame me" id="f9">
  <img src="photo.jpg" alt="">
  <div class="scrim"></div>
  <div class="h type"><span id="l1"></span><span id="cur1" class="cursor"></span><br><span id="l2" class="terra"></span><span id="cur2" class="cursor"></span></div>
</div>

<script>
  // Timeline on an 80 BPM grid (one beat = 0.75 s, the music is composed to it): hook 4 beats (0–3.0),
  // first home 2 beats (Kyle, 2026-10-30: he knows the listing agent, "just a little bit longer"), six homes at
  // 1 beat each, closing frame 4 beats. Every cut lands on a kick. Total 12.0 s = 4 bars.
  // Any tempo: comp.html#bpm=128&hook=8&first=3&home=2&tail=8 (counts in beats) re-times the whole reel so
  // the silent version can be posted with a licensed song from Instagram's picker. Defaults = the 80 BPM beds.
  const Q = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map((kv) => kv.split("=").map(decodeURIComponent)));
  const BPM = parseFloat(Q.bpm || "80"), BEAT0 = 60 / BPM;
  const HOOK = (parseFloat(Q.hook || "4")) * BEAT0, BEAT = (parseFloat(Q.home || "1")) * BEAT0,
        TAIL = (parseFloat(Q.tail || "4")) * BEAT0, FIRST = (parseFloat(Q.first || "2")) * BEAT0;
  const cuts = [...document.querySelectorAll(".cut")];
  const N = cuts.length;
  const starts = cuts.map((_, i) => HOOK + (i === 0 ? 0 : FIRST + (i - 1) * BEAT));
  const CUTS_END = HOOK + FIRST + (N - 1) * BEAT;
  window.DURATION = CUTS_END + TAIL;
  const frames = [...document.querySelectorAll(".frame")];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 2);

  window.seek = (t) => {
    frames.forEach((f) => f.classList.remove("on"));
    let frame, p, zoom;
    if (t < HOOK) { frame = document.getElementById("f0"); p = clamp(t / HOOK, 0, 1); zoom = 1 + 0.05 * p; }
    else if (t < CUTS_END) {
      let i = 0; while (i + 1 < N && t >= starts[i + 1]) i++;
      const len = i === 0 ? FIRST : BEAT;
      frame = cuts[i]; p = clamp((t - starts[i]) / len, 0, 1); zoom = 1 + 0.03 * easeOut(p);
    } else {
      // Closing frame: a slow push-in, the lines rising in one after another (brand motion), then a hold.
      const tt = t - CUTS_END;
      frame = document.getElementById("f9"); p = clamp(tt / TAIL, 0, 1); zoom = 1 + 0.04 * p;
      // Typewriter: the question types out at 14 characters a second after a short beat, cursor blinking after.
      const L1 = "What are you", L2 = "waiting for?", RATE = 14, START = 0.2;
      const n = Math.max(0, Math.floor((tt - START) * RATE));
      const n1 = Math.min(n, L1.length), n2 = Math.min(Math.max(0, n - L1.length - 1), L2.length);   // the space costs a tick
      document.getElementById("l1").textContent = L1.slice(0, n1);
      document.getElementById("l2").textContent = L2.slice(0, n2);
      const onLine2 = n > L1.length, done = n2 >= L2.length;
      const blink = Math.floor(tt * 2.2) % 2 === 0;
      document.getElementById("cur1").style.display = (!onLine2 && (n1 > 0 || blink)) ? "inline-block" : "none";
      document.getElementById("cur2").style.display = (onLine2 && (!done || blink)) ? "inline-block" : "none";
    }
    frame.classList.add("on");
    frame.querySelector("img").style.transform = `scale(${zoom.toFixed(4)})`;
  };
  window.seek(0);
</script>
</body>
</html>
