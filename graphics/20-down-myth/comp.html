<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  @font-face { font-family: "Caveat"; src: url("../fonts/Caveat.ttf"); font-weight: 400 700; }
  /* Coastal Money tokens (graphics/brand/coastal-money/GUIDELINES.md). Landscape 1080x640 card,
     cut into the talking head as a picture-in-picture box above Kyle's head. */
  :root { --navy:#173F4F; --terra:#D77B52; --terra-soft:#E7A481; --sand:#EFE9DE; --sage-lift:#A9C0B9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 640px; overflow: hidden; background: var(--navy); }
  /* #nocard variant: no navy panel, the type floats over the footage (render with --alpha). A soft navy
     shadow keeps sand and sage legible over bright sky; the fonts and colours stay on brand. */
  html.nocard, html.nocard body { background: transparent; }
  html.nocard .scene { text-shadow: 0 3px 18px rgba(14,42,53,.65), 0 1px 3px rgba(14,42,53,.5); }
  html.nocard .eyebrow { color: var(--sand); font-size: 34px; }   /* sage is a label colour on navy only */
  html.nocard .note { font-size: 76px; }
  body { font-family: "Manrope", sans-serif; color: var(--sand); }
  .scene { position: absolute; inset: 0; opacity: 0; padding: 56px 64px; }
  .h { font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .num { font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.82; font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage-lift); opacity: 0; }
  .terra { color: var(--terra); } .sand { color: var(--sand); }
  .mute { color: rgba(239,233,222,.72); }
  .w { display: inline-block; opacity: 0; transform: translateY(22px); }
  .ln { display: block; }
  .big { position: absolute; left: 64px; bottom: 64px; white-space: nowrap; display: inline-block; }
  .big .n { display: inline-block; font-size: 250px; position: relative; }
  .big .u { display: inline-block; font-family: "Sora", sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.02em; margin-left: 26px; vertical-align: 12px; }
  /* the X: two terracotta bars centred on the numeral, scaled in from zero */
  .x { position: absolute; left: 50%; top: 50%; width: 116%; height: 40px; margin-left: -58%; margin-top: -20px; background: var(--terra); border-radius: 17px; transform-origin: 50% 50%; opacity: 0; }
  .note { position: absolute; right: 64px; top: 48px; font-family: "Caveat", cursive; font-weight: 600; font-size: 64px; color: var(--terra); opacity: 0; transform-origin: 0 50%; text-align: right; line-height: 1; }

  /* s1 the myth */
  #s1 .eyebrow { position: absolute; left: 64px; top: 56px; }
  #s1 .big .n { color: var(--sand); }

  /* s2 the truth */
  #s2 .eyebrow { position: absolute; left: 64px; top: 56px; }
  #s2 .big .n { color: var(--terra); }

  /* s3 seller credit */
  #s3 .eyebrow { position: absolute; left: 64px; top: 56px; }
  #s3 .head { position: absolute; left: 64px; right: 64px; bottom: 64px; font-size: 112px; }

  /* s4 dm */
  #s4 .dm { position: absolute; left: 64px; bottom: 64px; font-size: 240px; color: var(--terra); opacity: 0; transform-origin: 0 100%; }
  #s4 .head { position: absolute; left: 500px; right: 64px; top: 92px; font-size: 68px; }
  #s4 .cont { position: absolute; left: 500px; right: 64px; bottom: 72px; font-size: 30px; opacity: 0; }
</style></head>
<body>

<div class="scene" id="s1">
  <div class="eyebrow" id="e1">You don't need</div>
  <div class="big num"><span class="n" id="n1">20%<div class="x" id="x1"></div><div class="x" id="x2"></div></span><span class="u">down</span></div>
</div>

<div class="scene" id="s2">
  <div class="eyebrow" id="e2">As little as</div>
  <div class="big num"><span class="n" id="n2">3%</span><span class="u">down</span></div>
  <div class="note" id="note2">that's it.</div>
</div>

<div class="scene" id="s3">
  <div class="eyebrow" id="e3">Seller credit</div>
  <div class="head h">
    <span class="ln sand"><span class="w">Buys</span> <span class="w">your</span></span>
    <span class="ln terra"><span class="w">rate</span> <span class="w">down.</span></span>
  </div>
</div>

<div class="scene" id="s4">
  <div class="dm num" id="dm">DM</div>
  <div class="head h">
    <span class="ln sand"><span class="w">Message</span> <span class="w">me</span></span>
    <span class="ln sand"><span class="w">for</span> <span class="w">the</span> <span class="w">details.</span></span>
  </div>
  <div class="cont mute" id="cont4">Kyle Melvin &middot; NMLS #1486450</div>
</div>

<script>
  if (location.hash === '#nocard') document.documentElement.classList.add('nocard');
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const back = x => { const c = 1.70158, k = c + 1; return 1 + k*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const p = (t, s, d) => clamp((t - s) / d);

  // scene windows [start, end] on the graphics timeline; cues.json slices these into the footage
  const S = { s1:[0,3.2], s2:[3.5,6.5], s3:[7.0,10.0], s4:[10.5,13.5] };
  const FADE = 0.2;
  function sceneOpacity(t, [a, b]) {
    if (t < a || t > b) return 0;
    return Math.min(p(t, a, FADE), 1 - p(t, b - FADE, FADE));
  }
  const words3 = Array.from(document.querySelectorAll('#s3 .w'));
  const words4 = Array.from(document.querySelectorAll('#s4 .w'));
  const rise = (els, t, s, gap = 0.09, d = 0.4) => els.forEach((w, i) => { const q = easeOut(p(t, s + i*gap, d)); w.style.opacity = q; w.style.transform = `translateY(${22*(1-q)}px)`; });
  const pop = (el, t, s, d = 0.45) => { const q = p(t, s, d); el.style.opacity = clamp(q*3); el.style.transform = `scale(${0.6 + 0.4*back(q)})`; };

  window.seek = function (t) {
    for (const k in S) $(k).style.opacity = sceneOpacity(t, S[k]);

    // s1: eyebrow, "20% down" pops, one beat, then the X slams through 20% and the numeral shudders
    $('e1').style.opacity = p(t, 0.15, 0.25);
    const n1 = $('n1'); const q1 = p(t, 0.3, 0.45);
    const hit = p(t, 1.15, 0.22);
    const shake = hit > 0 && hit < 1 ? 5*Math.sin(t*90)*(1-hit) : 0;
    n1.parentElement.style.opacity = clamp(q1*3);
    n1.parentElement.style.transform = `translate(${shake}px,0) scale(${0.6 + 0.4*back(q1)})`;
    n1.parentElement.style.transformOrigin = '0 100%';
    const xs = easeOut(hit);
    $('x1').style.opacity = hit > 0 ? 1 : 0; $('x1').style.transform = `rotate(-28deg) scaleX(${xs})`;
    const hit2 = p(t, 1.3, 0.22); const xs2 = easeOut(hit2);
    $('x2').style.opacity = hit2 > 0 ? 1 : 0; $('x2').style.transform = `rotate(28deg) scaleX(${xs2})`;
    n1.style.color = `rgba(239,233,222,${1 - 0.5*easeOut(hit2)})`;

    // s2: eyebrow, "3% down" pops in terracotta, handwritten note after a beat
    $('e2').style.opacity = p(t, 3.65, 0.25);
    const b2 = $('n2').parentElement; const q2 = p(t, 3.8, 0.45);
    b2.style.opacity = clamp(q2*3); b2.style.transformOrigin = '0 100%'; b2.style.transform = `scale(${0.6 + 0.4*back(q2)})`;
    const nq = p(t, 4.9, 0.35); $('note2').style.opacity = clamp(nq*2); $('note2').style.transform = `rotate(-4deg) scale(${0.8 + 0.2*back(nq)})`;

    // s3: eyebrow then two-tone headline word by word
    $('e3').style.opacity = p(t, 7.15, 0.25);
    rise(words3, t, 7.35);

    // s4: DM numeral pops, headline rises, sign-off line
    pop($('dm'), t, 10.65);
    rise(words4, t, 10.9);
    $('cont4').style.opacity = p(t, 12.0, 0.3);
  };
  window.seek(0);
</script>
</body></html>
