<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* The chalkboard as a box above Kyle's head (round two, 2026-11-11: "have it be a box like a picture in picture, not take
     up the entire screen", and "bring the chalkboard up when I start talking about numbers"). 952x480 flat navy box with
     20 px corners, rendered with --alpha at 952x504 (24 px of headroom for the rise) and overlaid on the footage at
     (64, 246). Same engine as board.html: Caveat lines pre-rendered with a chalk grain, wiped on left to right on the
     spoken word, terracotta answer circled, one eraser sweep at the cut into Clip C; the verdict lines then go where the
     setup lines were. Times are cut.mp4 seconds; the render starts at T0 (#t0=9.4), so seek(t) draws cut time t + T0. */
  @font-face { font-family: "Caveat"; src: url("../fonts/Caveat.ttf"); font-weight: 400 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 952px; height: 504px; overflow: hidden; background: transparent; }
  #box { position: absolute; left: 0; top: 0; width: 952px; height: 480px; border-radius: 20px; background: #173F4F; overflow: hidden; opacity: 0; }
  canvas { position: absolute; left: 0; top: 0; }
  .preload { position: absolute; left: -9999px; font-family: "Caveat"; font-weight: 600; }
</style></head>
<body>
<div id="box"><canvas id="c" width="952" height="480"></canvas></div>
<span class="preload">chalk</span>
<script>
  const W = 952, H = 480, SAND = '#EFE9DE', TERRA = '#D77B52';
  const T0 = parseFloat((location.hash.match(/t0=([\d.]+)/) || [])[1] || '0');
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const p = (t, s, d) => clamp((t - s) / d);
  const easeOut = x => 1 - Math.pow(1 - x, 2);

  const IN_T = 9.5, IN_D = 0.4;            // the box rises in as he says "rate, and", a beat before "half a percent"
  const ERASE_T = 23.1, ERASE_D = 0.7;     // the cut into Clip C
  const LINES = [
    { id: 'rate',  text: '0.5% lower rate',  x: 48,  y: 78,  size: 62, color: SAND,  s: 10.16, d: 1.8,  rot: -0.6, erase: true },
    { id: 'costk', text: 'cost',             x: 48,  y: 146, size: 62, color: SAND,  s: 12.16, d: 0.4,  rot: 0.4,  erase: true },
    { id: 'costv', text: '$10,000',          x: 290, y: 146, size: 62, color: SAND,  s: 12.55, d: 0.7,  rot: -0.3, erase: true },
    { id: 'savk',  text: 'saves',            x: 48,  y: 214, size: 62, color: SAND,  s: 14.4,  d: 0.45, rot: 0.5,  erase: true },
    { id: 'savv',  text: '$100 / month',     x: 290, y: 214, size: 62, color: SAND,  s: 15.1,  d: 1.0,  rot: -0.4, erase: true },
    { id: 'eq',    text: '$10,000 ÷ $100 =', x: 48, y: 296, size: 68, color: SAND, s: 16.2, d: 0.65, rot: -0.5 },
    { id: 'ans',   text: '100 months',       x: 70,  y: 418, size: 100, color: TERRA, s: 16.88, d: 0.9, rot: -1.2 },
    { id: 'yrs',   text: '8 years, 4 months', x: 608, y: 406, size: 50, color: SAND,  s: 20.46, d: 1.3,  rot: 0.6 },
    // Clip C, in the space the eraser cleared
    { id: 'lcost', text: 'cost',             x: 0,   y: 202, size: 40, color: SAND,  s: 24.6,  d: 0.4,  rot: -0.8, over: 'costv_eq', alpha: .9 },
    { id: 'lsav',  text: 'monthly savings',  x: 0,   y: 202, size: 40, color: SAND,  s: 25.25, d: 0.8,  rot: 0.7,  over: 'savv_eq', alpha: .9 },
    { id: 'v1',    text: 'staying longer?  →  buy it down',    x: 48, y: 72,  size: 56, color: SAND, s: 26.4, d: 1.1,  rot: -0.4, gap: 27.76, gapAt: 16, gapD: 0.7 },
    { id: 'v2',    text: 'leaving sooner?  →  keep your cash', x: 48, y: 138, size: 56, color: SAND, s: 28.8, d: 0.75, rot: 0.5,  gap: 29.68, gapAt: 16, gapD: 0.65 },
  ];
  const CIRCLE = { s: 17.8, d: 0.9 };
  const UNDER  = { s: 30.3, d: 0.35 };
  const ARROWS = [ { from: 'lcost', to: 'costv_eq', s: 25.0, d: 0.25 }, { from: 'lsav', to: 'savv_eq', s: 26.05, d: 0.25 } ];

  const box = document.getElementById('box'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const font = (size) => `600 ${size}px Caveat`;

  function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function noiseTile(n, seed, pow) {
    const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d');
    const img = x.createImageData(n, n), r = mulberry(seed);
    for (let i = 0; i < n * n; i++) img.data[i * 4 + 3] = 255 * Math.pow(r(), pow);
    x.putImageData(img, 0, 0); return c;
  }
  const fine = noiseTile(256, 7, 2.2), coarse = noiseTile(128, 11, 3.5);
  function grain(x, w, h, strength) {
    x.save(); x.globalCompositeOperation = 'destination-out';
    x.globalAlpha = 0.5 * strength; x.fillStyle = x.createPattern(fine, 'repeat'); x.fillRect(0, 0, w, h);
    x.globalAlpha = 0.4 * strength; x.save(); x.scale(2.2, 1.2); x.fillStyle = x.createPattern(coarse, 'repeat'); x.fillRect(0, 0, w / 2.2, h / 1.2); x.restore();
    x.restore();
  }

  let ready = false;
  function prep() {
    const byId = Object.fromEntries(LINES.map(l => [l.id, l]));
    ctx.font = font(byId.eq.size);
    const eqPos = {};
    for (const [k, s] of Object.entries({ costv_eq: '$10,000', savv_eq: '$100' })) { const i = byId.eq.text.indexOf(s); const x0 = byId.eq.x + ctx.measureText(byId.eq.text.slice(0, i)).width; eqPos[k] = { x0, x1: x0 + ctx.measureText(s).width, y: byId.eq.y }; }
    for (const l of LINES) {
      ctx.font = font(l.size); l.w = ctx.measureText(l.text).width;
      if (l.over) { const e = eqPos[l.over]; l.x = Math.round((e.x0 + e.x1) / 2 - l.w / 2); }
      const pad = 30; l.cw = Math.ceil(l.w + pad * 2); l.ch = Math.ceil(l.size * 1.5);
      const c = document.createElement('canvas'); c.width = l.cw; c.height = l.ch; const x = c.getContext('2d');
      x.font = font(l.size); x.fillStyle = l.color;
      x.filter = 'blur(0.5px)'; x.fillText(l.text, pad, l.size * 1.05); x.filter = 'none';
      x.globalAlpha = .6; x.fillText(l.text, pad, l.size * 1.05); x.globalAlpha = 1;
      grain(x, l.cw, l.ch, l.size < 50 ? 0.7 : 0.9);
      l.canvas = c; l.ox = l.x - pad; l.oy = l.y - l.size * 1.05;
      if (l.gap) { x.font = font(l.size); l.gapW = x.measureText(l.text.slice(0, l.gapAt)).width; }
    }
    // keep the two label words apart if the equation's numbers sit close together
    const a1 = byId.lcost, a2 = byId.lsav; if (a1.x + a1.w + 28 > a2.x) a2.x = a1.x + a1.w + 28;
    const a = byId.ans; CIRCLE.cx = a.x + a.w / 2; CIRCLE.cy = a.y - a.size * 0.33; CIRCLE.rx = a.w / 2 + 40; CIRCLE.ry = a.size * 0.6;
    const v2 = byId.v2; ctx.font = font(v2.size); const i = v2.text.indexOf('keep'); UNDER.x0 = v2.x + ctx.measureText(v2.text.slice(0, i)).width; UNDER.x1 = v2.x + v2.w; UNDER.y = v2.y + 18;
    for (const ar of ARROWS) { const l = byId[ar.from], e = eqPos[ar.to]; ar.x0 = (e.x0 + e.x1) / 2; ar.y0 = l.y + 9; ar.y1 = e.y - byId.eq.size * 0.9; }
    ready = true;
  }

  function writtenWidth(l, t) {
    if (!l.gap) return l.w * p(t, l.s, l.d);
    return l.gapW * p(t, l.s, l.d) + (l.w - l.gapW) * p(t, l.gap, l.gapD);
  }
  function drawLine(l, t) {
    const w = writtenWidth(l, t); if (w <= 0) return;
    let clipL = 0;
    if (l.erase && t > ERASE_T) { clipL = (W + 120) * easeOut(p(t, ERASE_T, ERASE_D)) - 60; if (clipL > l.x + l.w + 40) return; }
    ctx.save();
    ctx.translate(l.x, l.y); ctx.rotate(l.rot * Math.PI / 180); ctx.translate(-l.x, -l.y);
    const left = Math.max(l.ox, clipL);
    ctx.beginPath(); ctx.rect(left, l.oy, l.x + w + 6 - left, l.ch); ctx.clip();
    ctx.globalAlpha = l.alpha || 1; ctx.drawImage(l.canvas, l.ox, l.oy);
    ctx.restore();
  }
  const scratch = document.createElement('canvas'); scratch.width = W; scratch.height = H; const sx = scratch.getContext('2d');
  function strokePath(points, q, color, width) {
    if (q <= 0) return;
    const n = Math.max(2, Math.floor(points.length * q));
    sx.clearRect(0, 0, W, H); sx.save(); sx.lineCap = 'round'; sx.lineJoin = 'round'; sx.strokeStyle = color; sx.lineWidth = width; sx.filter = 'blur(0.5px)';
    sx.beginPath(); for (let i = 0; i < n; i++) { const [x, y] = points[i]; i ? sx.lineTo(x, y) : sx.moveTo(x, y); } sx.stroke();
    sx.filter = 'none'; sx.globalAlpha = .5; sx.stroke(); sx.restore();
    grain(sx, W, H, 0.9);
    ctx.drawImage(scratch, 0, 0);
  }
  const circlePts = () => { const pts = []; for (let i = 0; i <= 140; i++) { const a = -1.9 + (i / 140) * (Math.PI * 2 + 0.75); const wob = 1 + 0.045 * Math.sin(a * 3.1 + 0.4) + 0.03 * Math.sin(a * 7.3); pts.push([CIRCLE.cx + CIRCLE.rx * wob * Math.cos(a), CIRCLE.cy + CIRCLE.ry * wob * Math.sin(a) + 7 * (i / 140)]); } return pts; };
  const underPts = () => { const pts = []; for (let i = 0; i <= 60; i++) { const u = i / 60; pts.push([UNDER.x0 + (UNDER.x1 - UNDER.x0) * u, UNDER.y + 4 * Math.sin(u * 6.1) + 3 * u]); } return pts; };
  const arrowPts = (ar) => { const pts = []; for (let i = 0; i <= 20; i++) { const u = i / 20; pts.push([ar.x0 + 4 * Math.sin(u * 3), ar.y0 + (ar.y1 - ar.y0) * u]); }
    const [hx, hy] = pts[pts.length - 1]; pts.push([hx - 9, hy - 10]); pts.push([hx, hy]); pts.push([hx + 9, hy - 10]); return pts; };

  window.seek = function (tt) {
    if (!ready) prep();
    const t = tt + T0;
    const q = easeOut(p(t, IN_T, IN_D));
    box.style.opacity = q; box.style.transform = `translateY(${24 * (1 - q)}px)`;
    ctx.clearRect(0, 0, W, H);
    for (const l of LINES) drawLine(l, t);
    strokePath(circlePts(), p(t, CIRCLE.s, CIRCLE.d), TERRA, 6.5);
    for (const ar of ARROWS) strokePath(arrowPts(ar), p(t, ar.s, ar.d), SAND, 3.5);
    strokePath(underPts(), p(t, UNDER.s, UNDER.d), TERRA, 5.5);
  };
</script>
</body></html>
