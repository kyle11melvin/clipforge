<!doctype html>
<html><head><meta charset="utf-8">
<!--
  The payoff of the rate-buydown reel (Kyle, 2026-11-12: "at the very end when I say keep the cash, just bring up like
  a lot of cash and go ding"). One heap: a fan of hundreds opening behind a row of strapped stacks, rising from the
  bottom of the frame on the word "cash".
    try 1  a storm of bills across the frame          -> "I do not mean like that ... a lot of cash and then go ding"
    try 2  one heap of flat mint clip-art bills       -> "sharpen it up to match the rest of the video"
    try 3  cut-paper bills                            -> "make the hundred dollar bills look a little more realistic and
                                                          also put them below my face"
  So the bills are now illustrated hundreds (pale green-grey paper, dark engraved print, portrait oval, seals, blue
  ribbon, big corner numerals, $10,000 straps) and the heap tops out at y≈1480, under his chin. Still a drawing with a
  cut edge, not a photo of currency. Render with alpha:
    node src/graphics/render.mjs "graphics/rate-buydown/cash.html#t0=30.1" videos/rate-buydown/cash.mov --alpha --duration 1.65
  seek(t) draws cut time t + T0. GO is the moment it starts to rise.
-->
<style>
  @font-face { font-family: "PlayfairB"; src: url("../fonts/PlayfairDisplay-Bold.ttf"); }
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #heap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .bill { position: absolute; border-radius: 5px; overflow: hidden; outline: 3px solid #F4F1E6;
          box-shadow: 0 0 0 4px rgba(14,42,53,.12), 0 9px 0 -2px rgba(8,26,34,.20), 0 14px 18px rgba(8,26,34,.40); }
  .bill svg { display: block; width: 100%; height: 100%; }
  /* fan: each bill stands on its short edge and pivots on a point below the frame */
  .fan { left: 418px; top: 1480px; width: 244px; height: 570px; transform-origin: 122px 660px; }
  .fan svg { width: 570px; height: 244px; transform-origin: 0 0; transform: translate(244px, 0) rotate(90deg); }
  .stack { position: absolute; width: 350px; height: 150px; }
  .stack .bill { left: 0; width: 350px; height: 150px; }
  .stack .band { position: absolute; left: 128px; top: -5px; width: 94px; height: 160px; background: #E9C46A;
                 box-shadow: 0 0 0 1px rgba(60,40,10,.45), inset 0 0 0 5px #F3D88F; font: 800 17px "Sora"; color: #5A4310;
                 writing-mode: vertical-rl; text-align: center; line-height: 94px; letter-spacing: 0.04em; }
</style></head>
<body>
<div id="heap"></div>
<script>
  const T0 = parseFloat((location.hash.match(/t0=([\d.]+)/) || [])[1] || '0');
  // #go=<s> start, #out=<s> drop back out of frame, #stacks=<n> how many strapped stacks (5 x $10,000 = the $50,000 in rate-wait)
  const hp = (k, d) => parseFloat((location.hash.match(new RegExp(k + '=([\\d.]+)')) || [])[1] || d);
  const GO = hp('go', 30.2), OUT = hp('out', 1e9), NST = hp('stacks', 7);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const outBack = (p) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const outCubic = (p) => 1 - Math.pow(1 - p, 3);
  const heap = document.getElementById('heap');

  // One illustrated hundred, 570 x 244. Ink is a dark green-black; the paper a pale green-grey.
  const INK = '#22382C', PAPER = '#DCE4CF';
  const BILL = (id) => `<svg viewBox="0 0 570 244" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="p${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6ECDA"/><stop offset="1" stop-color="#C8D4BA"/></linearGradient>
      <pattern id="l${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="5" stroke="${INK}" stroke-width="0.7" opacity="0.22"/></pattern>
      <pattern id="w${id}" width="14" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 Q3.5 0 7 4 T14 4" fill="none" stroke="${INK}" stroke-width="0.8" opacity="0.35"/></pattern>
    </defs>
    <rect width="570" height="244" fill="url(#p${id})"/>
    <rect x="9" y="9" width="552" height="226" fill="none" stroke="${INK}" stroke-width="3"/>
    <rect x="15" y="15" width="540" height="214" fill="url(#w${id})" stroke="${INK}" stroke-width="1"/>
    <rect x="62" y="34" width="446" height="176" fill="${PAPER}"/>
    <rect x="62" y="34" width="446" height="176" fill="url(#l${id})"/>
    <text x="285" y="30" text-anchor="middle" font-family="PlayfairB" font-size="13" letter-spacing="2.4" fill="${INK}">THE UNITED STATES OF AMERICA</text>
    <text x="285" y="225" text-anchor="middle" font-family="PlayfairB" font-size="13" letter-spacing="3" fill="${INK}">ONE HUNDRED DOLLARS</text>
    <!-- portrait oval with a plain engraved bust -->
    <ellipse cx="222" cy="122" rx="66" ry="82" fill="#CBD6BD" stroke="${INK}" stroke-width="3"/>
    <ellipse cx="222" cy="122" rx="59" ry="75" fill="url(#l${id})" stroke="${INK}" stroke-width="1"/>
    <clipPath id="c${id}"><ellipse cx="222" cy="122" rx="59" ry="75"/></clipPath>
    <g clip-path="url(#c${id})" fill="${INK}">
      <path d="M150 214 Q160 160 204 152 L240 152 Q284 160 294 214 Z" opacity="0.88"/>
      <path d="M208 150 L222 168 L236 150 Z" fill="${PAPER}"/>
      <ellipse cx="222" cy="108" rx="30" ry="36" fill="#AEBBA2"/>
      <path d="M190 104 Q186 66 222 64 Q258 66 254 104 Q262 128 256 146 Q248 122 246 100 Q232 84 198 100 Q196 124 188 146 Q182 126 190 104 Z" opacity="0.9"/>
    </g>
    <!-- seals -->
    <circle cx="104" cy="124" r="33" fill="none" stroke="${INK}" stroke-width="2.5"/><circle cx="104" cy="124" r="27" fill="none" stroke="${INK}" stroke-width="1" stroke-dasharray="2 2.5"/>
    <text x="104" y="135" text-anchor="middle" font-family="PlayfairB" font-size="30" fill="${INK}">L</text>
    <circle cx="452" cy="128" r="33" fill="none" stroke="#2F7D4F" stroke-width="5" stroke-dasharray="4 2.2"/><circle cx="452" cy="128" r="25" fill="#2F7D4F" opacity="0.85"/>
    <!-- blue security ribbon and the copper inkwell -->
    <rect x="318" y="15" width="20" height="214" fill="#3F6FB8"/><rect x="318" y="15" width="20" height="214" fill="none" stroke="#2B4F8A" stroke-width="1"/>
    <path d="M322 30 h12 M322 52 h12 M322 74 h12 M322 96 h12 M322 118 h12 M322 140 h12 M322 162 h12 M322 184 h12 M322 206 h12" stroke="#BFD4F2" stroke-width="5" opacity="0.8"/>
    <path d="M358 150 q16 -26 32 0 l-4 34 h-24 z" fill="#C47A3D" stroke="#8C5223" stroke-width="1.5"/>
    <!-- numerals and serials -->
    <text x="26" y="62" font-family="PlayfairB" font-size="40" fill="${INK}">100</text>
    <text x="544" y="62" text-anchor="end" font-family="PlayfairB" font-size="40" fill="${INK}">100</text>
    <text x="26" y="216" font-family="PlayfairB" font-size="40" fill="${INK}">100</text>
    <text x="546" y="214" text-anchor="end" font-family="PlayfairB" font-size="74" fill="#B8893A" stroke="#7C5A1E" stroke-width="1.2">100</text>
    <text x="356" y="58" font-family="Sora" font-weight="700" font-size="13" letter-spacing="1.5" fill="#2F7D4F">LB 1112 2026 A</text>
    <text x="74" y="196" font-family="Sora" font-weight="700" font-size="13" letter-spacing="1.5" fill="#2F7D4F">LB 1112 2026 A</text>
  </svg>`;

  let uid = 0;
  const fan = [];
  for (let i = 0; i < 11; i++) {
    const el = document.createElement('div'); el.className = 'bill fan'; el.innerHTML = BILL(uid++); heap.appendChild(el);
    fan.push({ el, ang: -62 + i * 12.4 });
  }
  // strapped stacks in front: [x, y, rotation, bills deep]
  const stacks = [[-50, 1760, -8, 5], [205, 1690, 5, 7], [470, 1725, -4, 6], [735, 1695, 7, 7], [890, 1790, -6, 5], [330, 1830, -3, 6], [625, 1840, 5, 6]].slice(0, NST).map(([x, y, rot, n], k) => {
    const el = document.createElement('div'); el.className = 'stack'; el.style.left = x + 'px'; el.style.top = y + 'px';
    for (let j = n - 1; j >= 0; j--) { const b = document.createElement('div'); b.className = 'bill'; b.style.top = (-j * 8) + 'px'; b.style.left = ((j % 2) * 4 - 2) + 'px';
      b.innerHTML = j === 0 ? BILL(uid++) : ''; if (j) b.style.background = '#D3DCC6'; el.appendChild(b); }
    const band = document.createElement('div'); band.className = 'band'; band.textContent = '$10,000'; el.appendChild(band);
    heap.appendChild(el);
    return { el, rot, delay: 0.03 * k };
  });

  window.seek = (tt) => {
    const t = tt + T0, a = Math.floor((t - GO) * 12) / 12, step = Math.floor(t * 6);     // on twos, like the other paper pieces
    const hs = (i) => { const x = Math.sin(step * 127.1 + i * 311.7) * 43758.5453; return (x - Math.floor(x) - 0.5); };
    if (t - GO < 0) { heap.style.opacity = 0; return; }
    heap.style.opacity = 1;
    heap.style.transform = `translateY(${Math.pow(clamp((t - OUT) / 0.3), 2) * 620}px)`;
    const open = outCubic(clamp((a - 0.1) / 0.4)), riseF = outBack(clamp(a / 0.42));
    fan.forEach((f, i) => f.el.style.transform = `translateY(${(1 - riseF) * 700}px) rotate(${f.ang * open + hs(i) * 1.0}deg)`);
    stacks.forEach((s, i) => { const r = outBack(clamp((a - s.delay) / 0.38)); s.el.style.transform = `translateY(${(1 - r) * 560}px) rotate(${s.rot + hs(i + 20) * 1.2}deg)`; });
  };
  window.seek(0);
</script>
</body></html>
