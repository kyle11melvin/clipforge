<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* G1 hook for the rate-buydown reel: Coastal Money two-tone, 2.6 s, opens before Clip A. */
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #173F4F; }
  body { font-family: "Manrope", sans-serif; color: #EFE9DE; position: relative; }
  .head { position: absolute; left: 64px; right: 64px; top: 600px; font-family: "Sora", sans-serif; font-weight: 700; font-size: 104px; line-height: 1.06; letter-spacing: -0.02em; }
  .ln { display: block; }
  .terra { color: #D77B52; }
  .w { display: inline-block; opacity: 0; transform: translateY(26px); }
  .cont { position: absolute; left: 64px; right: 64px; top: 1340px; font-size: 34px; color: rgba(239,233,222,.72); opacity: 0; }
</style></head>
<body>
<div class="head">
  <span class="ln"><span class="w">Buying</span> <span class="w">down</span></span>
  <span class="ln"><span class="w">your</span> <span class="w">rate?</span></span>
  <span class="ln terra"><span class="w">Do</span> <span class="w">this</span> <span class="w">math</span> <span class="w">first.</span></span>
</div>
<div class="cont" id="cont">Rate buydowns, explained &rarr;</div>
<script>
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const p = (t, s, d) => clamp((t - s) / d);
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const words = Array.from(document.querySelectorAll('.w'));
  const starts = [0.15, 0.27, 0.39, 0.51, 1.05, 1.15, 1.25, 1.35];   // a beat before the terracotta turn
  window.seek = function (t) {
    words.forEach((w, i) => { const q = easeOut(p(t, starts[i], 0.4)); w.style.opacity = q; w.style.transform = `translateY(${26 * (1 - q)}px)`; });
    const c = easeOut(p(t, 1.7, 0.45)); const el = document.getElementById('cont'); el.style.opacity = c; el.style.transform = `translateY(${16 * (1 - c)}px)`;
  };
</script>
</body></html>
