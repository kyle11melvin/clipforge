<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Asher dreams (2026-11-04, round three). Overlay rendered with --alpha over videos/asher-dreams/base.mp4, which has
     the crib-cam legs and black gaps; the dream shots here fill the gaps. Type is his reel-cover look (Nunito ExtraBold,
     white, black stroke). Images come from videos/asher-dreams/img/: for now AI stand-ins of a blue merle Aussie, to be
     replaced by Kyle's ChatGPT edits of the real Maverick (same filenames, 4:5). No clip-art anywhere (Kyle, 2026-11-04). */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../assets/fonts/Nunito-800-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; }
  .blk { display: none; position: absolute; inset: 0; } .blk.on { display: block; }
  .top { position: absolute; left: 50px; right: 140px; top: 262px; }
  .h { font-family: "Nunito", system-ui, sans-serif; font-weight: 800; font-size: 96px; line-height: 1.06; color: #fff;
    -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
  .w.y { color: #FFD60A; }
  .sting { position: absolute; left: 40px; right: 150px; top: 1362px; text-align: center; font-family: "Nunito", system-ui, sans-serif;
    font-weight: 800; font-size: 72px; line-height: 1.1; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; }
  /* Dream shot: the image blown up and blurred behind, the image itself as a 4:5 card inside the safe zone. */
  .dream .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .dream .card { position: absolute; left: 156px; top: 480px; width: 768px; height: 952px; border-radius: 28px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); transform-origin: center; }
  .dream .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dream .label { position: absolute; left: 50px; right: 140px; top: 262px; }
</style></head>
<body>
<div class="stage">
  <div class="blk" id="b0"><div class="top"><div class="h" id="h0"></div></div><div class="sting" id="s0" style="top:1272px"></div></div>
  <div class="blk dream" id="b1"><div class="bg" style="background-image:url(../../videos/asher-dreams/img/dream1-crib-bg.png)"></div>
    <div class="card"><img src="../../videos/asher-dreams/img/dream1-crib-card.png"></div><div class="label"><div class="h" id="h1"></div></div></div>
  <div class="blk dream" id="b2"><div class="bg" style="background-image:url(../../videos/asher-dreams/img/dream2-highchair-bg.png)"></div>
    <div class="card"><img src="../../videos/asher-dreams/img/dream2-highchair-card.png"></div><div class="label"><div class="h" id="h2"></div></div></div>
  <div class="blk dream" id="b3"><div class="bg" style="background-image:url(../../videos/asher-dreams/img/dream3-jersey-bg.png)"></div>
    <div class="card"><img src="../../videos/asher-dreams/img/dream3-jersey-card.png"></div><div class="label"><div class="h" id="h3"></div></div></div>
  <div class="blk dream" id="b4"><div class="bg" style="background-image:url(../../videos/asher-dreams/img/maverick-bg.png)"></div>
    <div class="card"><img src="../../videos/asher-dreams/img/maverick-card.png"></div><div class="label"><div class="h" id="h4"></div></div>
    <div class="sting" id="s4" style="top:1262px"></div></div>
</div>
<script>
  // base.mp4: L1 0-3.4 (hook, giggles 1+2) | dream1 3.4-4.8 | L2 4.8-7.1 (giggle, roll) | dream2 7.1-8.5 | L3 8.5-10.5 |
  // dream3 10.5-11.9 | L4 11.9-15.4 (tightest, longest laugh) | punchline 15.4-18.4.
  const T = { d1: 3.4, l2: 4.8, d2: 7.1, l3: 8.5, d3: 10.5, l4: 11.9, p: 15.4, end: 18.4 };
  window.DURATION = T.end;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const $ = (id) => document.getElementById(id);
  const blocks = [0, 1, 2, 3, 4].map((i) => $("b" + i));
  function words(el, html, t, gap = 0.08, dur = 0.28) {
    if (!el.dataset.built) {
      let y = false;
      el.innerHTML = html.split("<br>").map((line) => line.split(" ").map((w) => {
        if (w.startsWith("*")) y = true;
        const cls = y ? "w y" : "w", end = w.endsWith("*"); if (end) y = false;
        return `<span class="${cls}">${w.replace(/\*/g, "")}</span>`;
      }).join(" ")).join("<br>");
      el.dataset.built = "1";
    }
    [...el.querySelectorAll(".w")].forEach((w, i) => {
      const p = clamp((t - i * gap) / dur, 0, 1), e = easeOut(p);
      w.style.opacity = p; w.style.transform = `translateY(${(1 - e) * 50}px)`;
    });
  }
  function dream(i, tt, len, text) {
    const b = blocks[i]; b.classList.add("on");
    b.querySelector(".card").style.transform = `scale(${(1 + 0.06 * tt / len).toFixed(4)})`;
    words($("h" + i), text, tt - 0.05, 0.07);
  }
  window.seek = (t) => {
    blocks.forEach((b) => b.classList.remove("on"));
    if (t < T.d1) {
      blocks[0].classList.add("on");
      words($("h0"), "Asher laughing<br>in his sleep.", t - 0.1);
      words($("s0"), "He’s dreaming<br>about *the dog.*", t - 2.3, 0.07);
    } else if (t < T.l2) dream(1, t - T.d1, T.l2 - T.d1, "Maverick took<br>*the crib.*");
    else if (t < T.d2) { /* baby giggling, nothing on screen */ }
    else if (t < T.l3) dream(2, t - T.d2, T.l3 - T.d2, "Maverick took<br>*the high chair.*");
    else if (t < T.d3) { }
    else if (t < T.l4) dream(3, t - T.d3, T.l4 - T.d3, "Maverick in<br>*the 4th quarter.*");
    else if (t < T.p) { }
    else {
      const tt = t - T.p;
      dream(4, tt, T.end - T.p, "Meanwhile, *Maverick.*");
      words($("s4"), "Zero idea<br>what’s so funny.", tt - 1.2, 0.07);
    }
  };
  window.seek(0);
</script>
</body></html>
