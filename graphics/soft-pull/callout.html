<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  /* Floating callout over the footage (render with --alpha --size 1080x640, pip at the top):
     "Soft pull" with "No hit to your score", then "Hard pull" with "Only when you're ready".
     Comp time 0 = footage 7.6 s ("I do a soft credit pull first"). */
  :root { --terra:#D77B52; --sand:#EFE9DE; --ink:#0E2A35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 640px; overflow: hidden; background: transparent; }
  body { font-family: "Manrope", sans-serif; color: var(--sand); text-shadow: 0 4px 26px rgba(14,42,53,.8), 0 2px 5px rgba(14,42,53,.7); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .row { position: absolute; left: 60px; width: 960px; opacity: 0; transform-origin: 0 50%; }
  .row.l { top: 48px; }
  .row.r { top: 338px; }
  .head { font-family: "Sora", sans-serif; font-weight: 700; font-size: 150px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
  .row.r .head { color: var(--terra); }
  .sub { margin-top: 10px; font-weight: 700; font-size: 58px; line-height: 1.15; opacity: 0; }
  .rule { display: none; }
</style></head>
<body>
<div class="scene" id="s1">
  <div class="row l" id="cl"><div class="head">Soft pull</div><div class="sub" id="subl">No hit to your score</div></div>
  <div class="rule" id="rule"></div>
  <div class="row r" id="cr"><div class="head">Hard pull</div><div class="sub" id="subr">Only when you’re ready</div></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const back = x => { const c = 1.70158, k = c + 1; return 1 + k*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const p = (t, s, d) => clamp((t - s) / d);
  const FADE = 0.2, OUT = 11.6;
  function pop(el, q) { el.style.opacity = clamp(q*3); el.style.transform = `translateX(${(1-back(q))*-40}px) scale(${0.85 + 0.15*back(q)})`; }
  window.seek = function (t) {
    $('s1').style.opacity = Math.min(p(t, 0, FADE), 1 - p(t, OUT, FADE));
    pop($('cl'), p(t, 0.2, 0.45));                       // "Soft pull"           footage 7.8
    $('subl').style.opacity = p(t, 3.4, 0.3);            // "No hit to your score" footage 11.0 "nothing dings"
        pop($('cr'), p(t, 7.2, 0.45));                       // "Hard pull"           footage 14.8
    $('subr').style.opacity = p(t, 8.2, 0.3);            // "Only when you're ready" footage 15.8
  };
  window.seek(0);
</script>
</body></html>
