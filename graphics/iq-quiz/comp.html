<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  @font-face { font-family: "Caveat"; src: url("../fonts/Caveat.ttf"); font-weight: 400 700; }
  /* Coastal Money tokens (graphics/brand/coastal-money/GUIDELINES.md). Full-frame 1080x1920 cutaway:
     the real quiz page under a two-tone headline, so the camera leaves Kyle's face for a few seconds. */
  :root { --navy:#173F4F; --terra:#D77B52; --sand:#EFE9DE; --sand-deep:#E4DBCB; --sage:#7E9A93; --ink:#0E2A35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sand); }
  body { font-family: "Manrope", sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; opacity: 0; background: var(--sand); }
  .scene::after { content: ""; position: absolute; right: -200px; top: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(215,123,82,.10) 0, rgba(215,123,82,0) 70%); }
  .h { font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1.06; }
  .eyebrow { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); opacity: 0; }
  .terra { color: var(--terra); }
  .w { display: inline-block; opacity: 0; transform: translateY(26px); }
  .ln { display: block; }

  #s1 .eyebrow { position: absolute; left: 64px; top: 300px; }
  #s1 .head { position: absolute; left: 64px; right: 64px; top: 360px; font-size: 100px; }
  #s1 .shot { position: absolute; left: 64px; width: 952px; top: 820px; border-radius: 16px; overflow: hidden; opacity: 0; transform-origin: 50% 0; border: 1px solid rgba(14,42,53,.16); background: #fff; }
  #s1 .shot img { width: 100%; display: block; }
  #s1 .note { position: absolute; left: 64px; top: 1260px; font-family: "Caveat", cursive; font-weight: 600; font-size: 76px; line-height: 1.1; color: var(--terra); opacity: 0; transform-origin: 0 50%; }
  #s1 .rows { position: absolute; left: 64px; right: 64px; top: 1340px; display: grid; gap: 0; }
  #s1 .row { display: grid; grid-template-columns: 150px 1fr; gap: 28px; align-items: center; padding: 26px 0; border-top: 1px solid rgba(14,42,53,.16); opacity: 0; transform: translateY(18px); }
  #s1 .row .n { font-family: "Sora", sans-serif; font-weight: 700; font-size: 96px; letter-spacing: -0.03em; line-height: 0.82; color: var(--terra); }
  #s1 .row:nth-child(2) .n { color: var(--sage); }
  #s1 .row .t { font-size: 36px; line-height: 1.35; font-weight: 500; }
  #s1 .bottom { position: absolute; left: 64px; right: 64px; bottom: 72px; font-size: 34px; color: rgba(14,42,53,.72); opacity: 0; }
</style></head>
<body>

<div class="scene" id="s1">
  <div class="eyebrow" id="e1">Free quiz</div>
  <div class="head h">
    <span class="ln"><span class="w">What's</span> <span class="w">your</span></span>
    <span class="ln terra"><span class="w">financial</span> <span class="w">IQ?</span></span>
  </div>
  <div class="shot" id="shot"><img src="quiz-hero.png"></div>
  <div class="note" id="note">where do you stand?</div>
  <div class="bottom" id="bottom">Free &middot; Comment IQ &rarr;</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const back = x => { const c = 1.70158, k = c + 1; return 1 + k*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const p = (t, s, d) => clamp((t - s) / d);
  const S = { s1:[0, 6.0] };
  const FADE = 0.25;
  function sceneOpacity(t, [a, b]) { if (t < a || t > b) return 0; return Math.min(p(t, a, FADE), 1 - p(t, b - FADE, FADE)); }
  const words = Array.from(document.querySelectorAll('#s1 .w'));
  const rise = (els, t, s, gap = 0.09, d = 0.45) => els.forEach((w, i) => { const q = easeOut(p(t, s + i*gap, d)); w.style.opacity = q; w.style.transform = `translateY(${26*(1-q)}px)`; });

  window.seek = function (t) {
    for (const k in S) $(k).style.opacity = sceneOpacity(t, S[k]);
    $('e1').style.opacity = p(t, 0.2, 0.3);
    rise(words, t, 0.35);
    // the real page slides up with a slow drift
    const sq = easeOut(p(t, 0.9, 0.7)), drift = p(t, 0.9, 5.0);
    $('shot').style.opacity = sq; $('shot').style.transform = `translateY(${120*(1-sq) - 20*drift}px) scale(${1 + 0.02*drift})`;
    const nq = p(t, 1.8, 0.35); $('note').style.opacity = clamp(nq*2); $('note').style.transform = `rotate(-3deg) scale(${0.85 + 0.15*back(nq)})`;
    $('bottom').style.opacity = p(t, 3.2, 0.35);
  };
  window.seek(0);
</script>
</body></html>
