<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope.ttf"); font-weight: 200 800; }
  /* Floating CTA over the footage (render with --alpha, pip at the top): "Comment IQ". */
  :root { --terra:#D77B52; --sand:#EFE9DE; --ink:#0E2A35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 640px; overflow: hidden; background: transparent; }
  body { font-family: "Manrope", sans-serif; color: var(--sand); text-shadow: 0 3px 18px rgba(14,42,53,.65), 0 1px 3px rgba(14,42,53,.5); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .eyebrow { position: absolute; left: 64px; top: 70px; font-weight: 700; font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0; }
  .big { position: absolute; left: 64px; bottom: 64px; white-space: nowrap; opacity: 0; transform-origin: 0 100%; font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.82; }
  .big .c { font-size: 118px; color: var(--sand); }
  .big .iq { font-size: 236px; color: var(--terra); margin-left: 30px; }
</style></head>
<body>
<div class="scene" id="s1">
  <div class="eyebrow" id="e1">Want the quiz?</div>
  <div class="big" id="big"><span class="c">Comment</span><span class="iq">IQ</span></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const back = x => { const c = 1.70158, k = c + 1; return 1 + k*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const p = (t, s, d) => clamp((t - s) / d);
  const FADE = 0.2;
  window.seek = function (t) {
    $('s1').style.opacity = Math.min(p(t, 0, FADE), 1 - p(t, 3.8, FADE));
    $('e1').style.opacity = p(t, 0.15, 0.25);
    const q = p(t, 0.3, 0.45); $('big').style.opacity = clamp(q*3); $('big').style.transform = `scale(${0.6 + 0.4*back(q)})`;
  };
  window.seek(0);
</script>
</body></html>
